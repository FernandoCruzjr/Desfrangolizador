{id:"triceps-corda",g:"triceps",n:"Tríceps na polia com corda",eq:"polia",prim:"Tríceps (cabeças lateral e medial)",sec:"Ancôneo",lvl:"Iniciante",rx:["3–4","10–15","60 s"],

/* ---------------- QUADRÍCEPS ---------------- */
{id:"agachamento",g:"quads",n:"Agachamento livre",eq:"barra",prim:"Quadríceps, glúteo máximo",sec:"Adutores, eretores da espinha, core",lvl:"Intermediário",rx:["3–5","5–10","2–3 min"],

cue:["Pés mais baixos na plataforma → mais quadríceps; mais altos → mais glúteo e posterior.","Encha a máquina com consciência: amplitude vale mais que anilha."]},

{id:"bulgaro",g:"quads",n:"Agachamento búlgaro",eq:"halter",prim:"Quadríceps, glúteo máximo",sec:"Adutores, estabilizadores do quadril",lvl:"Intermediário",rx:["3","8–12 por perna","90 s"],

cue:["Tronco mais inclinado → mais glúteo; mais vertical → mais quadríceps.","Comece pela perna mais fraca."]},
{id:"hack",g:"quads",n:"Agachamento hack",eq:"maquina",prim:"Quadríceps",sec:"Glúteo",lvl:"Iniciante",rx:["3–4","8–12","2 min"],
