const LS = "desfr:";
const Store = {
  mem:{}, db:null, uid:null, t:{}, busy:{}, again:{},
  init(){ try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(LS)) { try { this.mem[k.slice(LS.length)] = JSON.parse(localStorage.getItem(k)); } catch(e){} } } } catch(e){} },
  get(k){ return this.mem[k]; },
  put(k, v){ v = JSON.parse(JSON.stringify(v)); v._ts = Date.now(); this.mem[k] = v; this.local(k, v); this.queue(k); },
  del(k){ this.mem[k] = null; this.local(k, null); this.queue(k); },
  local(k, v){ try { v == null ? localStorage.removeItem(LS + k) : localStorage.setItem(LS + k, JSON.stringify(v)); } catch(e){} },
  keys(prefix){ return Object.keys(this.mem).filter(k => k.startsWith(prefix) && this.mem[k]); },
  queue(k){ if (!this.db) return; clearTimeout(this.t[k]); setSync("saving"); this.t[k] = setTimeout(() => this.flush(k), 800); },
  async flush(k){
    if (this.busy[k]) { this.again[k] = true; return; }
    this.busy[k] = true;
    try { const ref = this.db.collection("data/users/" + this.uid).doc(k); const v = this.mem[k]; if (v == null) await ref.delete(); else await ref.set(v); setSync("ok"); }
    catch(e){ console.warn(e); setSync(e && e.code === "quota_exceeded" ? "quota" : "err"); }
    this.busy[k] = false;
    if (this.again[k]) { this.again[k] = false; this.flush(k); }
  },
  async connect(){
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.db = db; this.uid = id;
      const snap = await db.collection("data/users/" + id).limit(1000).get();
      const remote = {}; snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });
      let changed = false;
      for (const k in remote) { const r = remote[k], l = this.mem[k]; if (!l || (r._ts || 0) > (l._ts || 0)) { this.mem[k] = JSON.parse(JSON.stringify(r)); this.local(k, this.mem[k]); changed = true; } }
      const push = Object.keys(this.mem).filter(k => this.mem[k] && (!remote[k] || (this.mem[k]._ts || 0) > (remote[k]._ts || 0)));
      for (const k of push) await this.flush(k);
      setSync("ok");
      if (changed) render();
    } catch(e){ console.warn(e); setSync("err"); }
  }
};
function setSync(s){
  const txt = {ok:"Sincronizado na sua conta", saving:"Salvando…", err:"Sem conexão · salvo no aparelho", quota:"Espaço cheio · salvo no aparelho", local:"Salvo neste aparelho"}[s] || "";
  const short = {ok:"Sincronizado", saving:"Salvando…", err:"Offline", quota:"Cheio", local:"Local"}[s] || "";
  [["sync1", txt], ["sync2", short]].forEach(([id, t]) => { const el = document.getElementById(id); if (el) { el.className = "sync " + (s === "ok" ? "ok" : (s === "err" || s === "quota") ? "err" : ""); el.querySelector("span").textContent = t; } });
}

function waterCalc(p){
  const a = +p.age || 25;
  const mlkg = a <= 17 ? 40 : a <= 55 ? 35 : a <= 65 ? 30 : 25;
  const base = mlkg * (+p.weight || 0);
  const train = (+p.trainMin || 0) / 60 * 500;
  const hot = p.hot ? 500 : 0;
  return {mlkg, base, train, hot, total: Math.round((base + train + hot) / 50) * 50};
}
function calc(p){
  const w = +p.weight || 0, h = +p.height || 0, a = +p.age || 0;
  const mif = 10 * w + 6.25 * h - 5 * a + (p.sex === "m" ? 5 : -161);
  const bf = parseFloat(p.bf);
  const lbm = bf > 2 && bf < 60 ? w * (1 - bf / 100) : null;
  const katch = lbm ? 370 + 21.6 * lbm : null;
  const useK = p.formula === "katch" && katch;
  const bmr = useK ? katch : mif;
  const tdee = bmr * p.act;
  const delta = (GOALS[p.goal] || GOALS.bulk).delta;
  const kcal = Math.round(tdee + delta);
  const prot = Math.round(p.pkg * w), fat = Math.round(p.fkg * w);
  const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
  return {mif, katch, bmr, tdee, delta, kcal, prot, fat, carb, lbm, useK, water: waterCalc(p)};
}
const MEAL_NAMES = {
  3:["Café da manhã","Almoço","Jantar"],
  4:["Café da manhã","Almoço","Lanche da tarde","Jantar"],
  5:["Café da manhã","Lanche da manhã","Almoço","Lanche da tarde","Jantar"],

};
function dayWindow(p){ const w = toMin(p.wake); let s = toMin(p.sleep); if (s <= w) s += 1440; return [w, s]; }
function mealPlan(p){
  const n = clamp(+p.meals || 5, 3, 6), [w, s] = dayWindow(p);
  const first = w + 30, step = Math.max(60, (s - 120 - first) / (n - 1));
  return MEAL_NAMES[n].map((name, i) => ({name, time: (p.mealTimes && p.mealTimes.length === n && p.mealTimes[i]) ? p.mealTimes[i] : toHM(r15(first + step * i))}));
}
function waterPlan(p){
  const total = waterCalc(p).total, [w, s] = dayWindow(p), end = s - 60;
  const n = clamp(Math.round(total / 300), 6, 14), step = (end - w) / (n - 1);
  const ml = Math.round(total / n / 10) * 10;
  return Array.from({length:n}, (_, i) => ({time: toHM(r15(w + step * i)), ml}));
}

/* Faixas de referência das balanças de bioimpedância (adultos). */
function biaStatus(p, k, v){
  const m = p.sex !== "f";
  if (k === "bf") return m ? (v < 8 ? ["warn","muito baixo"] : v <= 20 ? ["good","faixa saudável"] : v <= 25 ? ["warn","acima do ideal"] : ["bad","alto"]) : (v < 15 ? ["warn","muito baixo"] : v <= 30 ? ["good","faixa saudável"] : v <= 35 ? ["warn","acima do ideal"] : ["bad","alto"]);
  if (k === "water") { const lo = m ? 50 : 45, hi = m ? 65 : 60; return v < lo ? ["warn","baixa: beba mais água"] : v > hi ? ["good","alta"] : ["good","normal"]; }
  if (k === "visc") return v <= 9 ? ["good","normal"] : v <= 14 ? ["warn","alta"] : ["bad","muito alta"];
  if (k === "protein") return v < 16 ? ["warn","baixa"] : v <= 20 ? ["good","normal"] : ["good","ótima"];
  if (k === "hr") return v < 50 ? ["warn","baixa: confira sentado"] : v <= 80 ? ["good","normal"] : ["warn","alta: confira em repouso"];
  if (k === "ecwr") return v <= 0.39 ? ["good","equilibrada"] : v <= 0.4 ? ["warn","um pouco alta"] : ["bad","alta: retenção ou inflamação"];
  return null;
}
const measures = () => ((Store.get("measures") || {}).list || []).slice().sort((a, b) => a.date.localeCompare(b.date));
function navyBF(p, m){
  const h = +p.height, n = +m.neck, w = +m.waist, hip = +m.hip;
  if (!h || !n || !w) return null;
  if (p.sex === "m") { if (w - n <= 0) return null; return 495 / (1.0324 - 0.19077 * Math.log10(w - n) + 0.15456 * Math.log10(h)) - 450; }
  if (!hip || w + hip - n <= 0) return null;
  return 495 / (1.29579 - 0.35004 * Math.log10(w + hip - n) + 0.221 * Math.log10(h)) - 450;
}

/* Jackson & Pollock 3 dobras + Siri */
function jp3(p, m){
  const a = +p.age; let sum, dens;
  if (p.sex === "m") { if (!(+m.sf_chest && +m.sf_abd && +m.sf_thigh)) return null; sum = +m.sf_chest + +m.sf_abd + +m.sf_thigh; dens = 1.10938 - 0.0008267 * sum + 0.0000016 * sum * sum - 0.0002574 * a; }
  else { if (!(+m.sf_tri && +m.sf_supra && +m.sf_thigh)) return null; sum = +m.sf_tri + +m.sf_supra + +m.sf_thigh; dens = 1.0994921 - 0.0009929 * sum + 0.0000023 * sum * sum - 0.0001392 * a; }
  return 495 / dens - 450;
}
/* % de gordura de um registro: informado > dobras > Marinha */
function bfOf(p, m){ if (+m.bf) return {v:+m.bf, src:"informado"}; const j = jp3(p, m); if (j) return {v:j, src:"dobras (Jackson & Pollock)"}; const n = navyBF(p, m); if (n) return {v:n, src:"método da Marinha"}; return null; }
/* média móvel de 7 dias por data */
function movingAvg(pts, days = 7){ return pts.map(pt => { const lim = addDays(pt.x, -(days - 1)); const w = pts.filter(q => q.x >= lim && q.x <= pt.x); return {x:pt.x, y:w.reduce((a, q) => a + q.y, 0) / w.length}; }); }
