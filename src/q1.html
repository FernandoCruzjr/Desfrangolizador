<title>Desfrangolizador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: painel escuro de academia — barra lateral no desktop, barra inferior com botão central no celular; cartões de vidro sobre um fundo azul-petróleo. Tema único (escuro) por escolha. */
:root{
  color-scheme:dark;
  --bg:#06131B; --bg-glow1:rgba(32,150,160,.22); --bg-glow2:rgba(30,90,170,.20);
  --surface:#0E222D; --surface2:#15303D; --surface3:#1B3B4A; --glass:rgba(255,255,255,.045); --glass-b:rgba(255,255,255,.085);
  --ink:#EAF3F5; --muted:#92ADB7; --faint:#5E7D88; --line:#1E3C4A;
  --accent:#3CC8E6; --accent-ink:#78DDF2; --accent-soft:rgba(60,200,230,.14); --on-accent:#032029;
  --lime:#3DDC97; --flame:linear-gradient(135deg,#3DDC97,#3CC8E6);
  --prot:#E8763F; --carb:#3D95F5; --fat:#27B07E; --kcal:#3CC8E6;
  --good:#3DDC97; --warn:#F2B14A; --bad:#F06A5C;
  --body:#173543; --muscle:#25495A; --muscle-hi:#3CC8E6;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:18px; --r-sm:11px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg) radial-gradient(1200px 700px at 85% -10%,var(--bg-glow1),transparent 60%) fixed,radial-gradient(900px 600px at -10% 110%,var(--bg-glow2),transparent 60%) fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
a{color:var(--accent-ink)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--glass-b);background:rgba(6,19,27,.6);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.brand-mark{width:42px;height:42px;flex:none;border-radius:11px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:11px;color:var(--accent-ink);font-weight:600;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600;text-align:left}
.nav button svg{width:21px;height:21px;flex:none}
.nav button:hover{background:var(--glass);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(60,200,230,.25)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--faint)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.ok i{background:var(--good);box-shadow:0 0 8px var(--good)} .sync.err i{background:var(--bad)}

.main{min-width:0;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--flame);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:18px;flex:none;border:2px solid rgba(255,255,255,.15)}
.hello{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.1}
.hello b{font-weight:800;text-transform:uppercase}
.hello-sub{font-size:13px;color:var(--muted)}
.topbar .iconbtn{margin-left:auto;position:relative}
.topbar .iconbtn .badge{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tabbar{display:none}
.mtop{display:none}

@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop .brand{padding:0}.mtop .brand-mark{width:30px;height:30px;border-radius:8px}.mtop .brand-name{font-size:15px}
  .main{padding-block:12px 120px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(9,26,35,.92);backdrop-filter:blur(14px);border-top:1px solid var(--glass-b);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 9px;font-size:11px;font-weight:600;color:var(--faint)}
  .tabbar button svg{width:23px;height:23px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar .fab{position:relative;top:-16px;padding:0;align-self:center}
  .fab span{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#1B4F66,#0B2A3A);border:2px solid var(--accent);box-shadow:0 0 0 5px rgba(6,19,27,.9),0 0 22px rgba(60,200,230,.45);display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .fab span svg{width:28px;height:28px}
}

/* ---------- títulos ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.ph h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em}
.ph .lede{color:var(--muted);max-width:62ch;margin-top:6px}
.sec-t{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin-top:6px}

/* ---------- cartões ---------- */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--glass-b);border-radius:var(--r);padding:18px;min-width:0;backdrop-filter:blur(10px)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;font-family:var(--f-display);letter-spacing:-.01em}
.panel-h h2 svg{width:19px;height:19px;color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-calc{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.g-evo{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}
.g-dash{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
@media (max-width:899px){.g2,.g3,.g-calc,.g-evo{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g-dash{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}

/* ---------- botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--glass-b);background:var(--glass);padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:rgba(255,255,255,.2)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--flame);border-color:transparent;color:var(--on-accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.pill-cta{border-radius:999px;background:linear-gradient(180deg,#E9FBFF,#BFEFF8);color:#05303C;font-weight:800;letter-spacing:.02em;text-transform:uppercase;font-size:13px;border:0;padding:11px 18px}
.btn.dark{background:var(--surface3);border-color:var(--surface3)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--glass)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;border:1px solid transparent;background:none;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--glass);color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.input,select.input{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.22);border-radius:11px;padding:10px 12px;font-size:16px;min-width:0;color:var(--ink)}
.input::placeholder{color:var(--faint)}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.input-u{position:relative}
.input-u .input{padding-right:46px}
.input-u > span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--faint);pointer-events:none}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:inline-flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface3);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(60,200,230,.35)}
input[type=range]{width:100%;accent-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:rgba(60,200,230,.45)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted)}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.pill.ac{background:var(--accent-soft);color:var(--accent-ink)}
.note{display:flex;gap:10px;align-items:flex-start;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--accent)}
.note b{color:var(--ink)}
.note.warn svg{color:var(--warn)}
.note.good svg{color:var(--lime, #3DDC97)}
.feat{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}.feat-i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-b);color:var(--accent)}.feat-i svg{width:20px;height:20px}.feat-hero{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(90deg,rgba(61,220,151,.14),rgba(60,200,230,.12));border:1px solid rgba(60,200,230,.3);border-radius:14px;padding:12px 14px;font-size:14px}
.banner b{color:var(--accent-ink)}
.muted{color:var(--muted)} .small{font-size:13px} .hide{display:none!important}

/* ---------- números e macros ---------- */
.stat .lbl{display:block;margin-bottom:4px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em}
.stat .v small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.stat .d{font-size:13px;color:var(--muted);margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mbar{display:flex;flex-direction:column;gap:6px}
.mbar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.mbar-top b{font-weight:700;display:inline-flex;align-items:center;gap:7px}
.mbar-top b i{width:10px;height:10px;border-radius:3px;display:inline-block}
.track{height:10px;border-radius:99px;background:rgba(0,0,0,.3);border:1px solid var(--line);overflow:hidden;position:relative}
.track > span{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.track.over > span{background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.3) 5px 8px)}
.mbar .rest{font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.c-p{background:var(--prot)} .c-c{background:var(--carb)} .c-f{background:var(--fat)} .c-k{background:var(--kcal)}
.ring{position:relative;width:170px;height:170px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr .v{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1}
.ring .ctr .l{font-size:12px;color:var(--muted)}
.ring circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- início ---------- */
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.tile:hover{border-color:rgba(60,200,230,.35)}
.tile-t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.tile-t svg{width:16px;height:16px;color:var(--accent)}
.hyd{align-items:center;justify-content:center;text-align:center}
.hyd-ring{position:relative;width:min(150px,100%);aspect-ratio:1;max-width:100%}
.hyd-ring svg{width:100%;height:100%}
.hyd-ring .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.hyd-ring .ic svg{width:34%;height:34%}
.minibars{display:flex;align-items:flex-end;gap:6px;height:64px}
.minibars > div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.minibars i{display:block;width:100%;border-radius:4px 4px 2px 2px;min-height:3px}
.minibars span{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.wk-card{display:flex;align-items:center;gap:12px}
.wk-ic{width:44px;height:44px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.wk-ic svg{width:24px;height:24px}
.wk-t{font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.02em}
.wk-s{font-size:13px;color:var(--muted)}
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekdots div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.weekdots i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal}
.weekdots i svg{width:15px;height:15px}
.weekdots .done i{background:var(--flame);border-color:transparent;color:var(--on-accent)}
.weekdots .today i{border-color:var(--accent);box-shadow:0 0 10px rgba(60,200,230,.4)}
.meals-mini{display:flex;flex-direction:column;gap:8px}
.mm-card{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;color:inherit}
.mm-card .t{font-weight:700;font-size:14px}
.mm-card .s{font-size:12px;color:var(--muted)}
.mm-card .x{margin-left:auto;color:var(--muted)}
.mm-card .x svg{width:16px;height:16px}
.mm-card .mi{width:32px;height:32px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.mm-card .mi svg{width:17px;height:17px}
.level{display:flex;gap:16px;align-items:center}
.level-badge{width:66px;height:66px;flex:none;border-radius:18px;background:var(--flame);display:flex;align-items:center;justify-content:center;color:var(--on-accent);box-shadow:0 0 24px rgba(61,220,151,.35)}
.level-badge svg{width:36px;height:36px}
.level-n{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.xp{height:10px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.xp span{display:block;height:100%;background:var(--flame);border-radius:99px}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.ladder div{font-size:11px;text-align:center;color:var(--faint);font-weight:700;padding:6px 2px;border-radius:8px;border:1px solid var(--line)}
.ladder .on{color:var(--on-accent);background:var(--flame);border-color:transparent}
.ladder .past{color:var(--accent-ink);border-color:rgba(60,200,230,.35)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bdg{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--faint);background:rgba(0,0,0,.18)}
.bdg svg{width:22px;height:22px;flex:none}
.bdg b{display:block;font-size:13px}
.bdg.on{color:var(--ink);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.08)}
.bdg.on svg{color:var(--lime)}
.report{white-space:pre-wrap;font-size:14px;line-height:1.6}
.diag{display:flex;flex-direction:column;gap:8px}
.diag div{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:14px}
.diag svg{width:18px;height:18px;margin-top:2px}
.diag .ok svg{color:var(--good)} .diag .bad svg{color:var(--warn)}

/* ---------- plano ---------- */
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.goals{grid-template-columns:minmax(0,1fr)}}
.goal{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:rgba(0,0,0,.2);text-align:left;display:flex;flex-direction:column;gap:6px}
.goal:hover{border-color:var(--faint)}
.goal[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px rgba(60,200,230,.18)}
.goal .gi{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.goal[aria-pressed="true"] .gi{background:var(--flame);color:var(--on-accent)}
.goal .gi svg{width:20px;height:20px}
.goal .gt{font-weight:700}
.goal .gk{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.goal .gk small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600}
.goal .gd{font-size:12px;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.2);text-align:left}

.act .af{font-family:var(--f-mono);font-size:13px;font-weight:600;background:var(--surface2);border-radius:6px;padding:2px 7px;flex:none}

.act .at{font-weight:600;font-size:14px}
.act .ad{font-size:12px;color:var(--muted)}
.energy{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.energy > div{flex:1;padding:14px;min-width:0}

.energy .v{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.energy .t{font-size:12px;color:var(--muted)}

@media (max-width:420px){.energy .v{font-size:21px}.energy > div{padding:12px 10px}}
.stack{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}

.slider-row{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:12px;align-items:center}
.slider-row .sv{font-family:var(--f-mono);font-size:13px;text-align:right}
@media (max-width:520px){.slider-row{grid-template-columns:minmax(0,1fr) 84px}.slider-row input{grid-column:1/-1;grid-row:2}}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.mtable tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.switch{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.switch .sw{width:44px;height:26px;border-radius:99px;background:var(--surface3);position:relative;flex:none;transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#DDE9EC;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.switch[aria-pressed="true"] .sw{background:var(--lime)}
.switch[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.switch .st{font-weight:600;font-size:14px}
.switch .sd{font-size:12px;color:var(--muted)}
.switch > svg{width:22px;height:22px;color:var(--accent);flex:none}
.mt-list{display:flex;flex-direction:column;gap:8px}
.mt{display:grid;grid-template-columns:34px minmax(0,1fr) 136px;gap:10px;align-items:center}
.mt .mi{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.mt .mi svg{width:18px;height:18px}
.mt .input{padding:7px 10px;font-size:15px}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:rgba(0,0,0,.2)}
.wchip svg{width:13px;height:13px;color:var(--carb)}
.cal-links{display:flex;flex-wrap:wrap;gap:6px}
.cal-links a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:rgba(0,0,0,.2)}
.cal-links a:hover{border-color:var(--accent)}
.cal-links a svg{width:14px;height:14px;color:var(--accent)}
.supp{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 110px 38px;gap:8px;align-items:center}
.supp .input{padding:7px 10px;font-size:14px}
@media (max-width:520px){.supp{grid-template-columns:minmax(0,1fr) 92px 38px}.supp .sdose{grid-column:1/2;grid-row:2}}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:12px;padding:9px 12px;text-align:left;width:100%}
.check .bx{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;flex:none;color:transparent}
.check .bx svg{width:15px;height:15px}
.check[aria-pressed="true"] .bx{background:var(--lime);border-color:var(--lime);color:var(--on-accent)}
.check[aria-pressed="true"] .ct{text-decoration:line-through;color:var(--muted)}
.check .ct{font-weight:600;font-size:14px}
.check .cs{font-size:12px;color:var(--muted);margin-left:auto;font-family:var(--f-mono)}

/* ---------- dieta ---------- */
.daynav{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:4px}
.daynav .dl{font-weight:700;min-width:150px;text-align:center;font-size:14px}
.meal{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--glass-b);border-radius:var(--r);overflow:hidden}
.meal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.meal-h .mi{width:36px;height:36px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.meal-h .mi svg{width:20px;height:20px}
.meal-h h3{font-size:16px;font-weight:700;font-family:var(--f-display);letter-spacing:-.01em}
.meal-h .mm{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.meal-h .mk{font-family:var(--f-display);font-weight:800;font-size:20px;margin-left:auto;white-space:nowrap}
.meal-h .mk small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto 40px 30px 30px;gap:8px;align-items:center;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .in{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.item .im{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-mono)}
.item .im span{display:inline-flex;align-items:center;gap:4px}
.item .ik{font-family:var(--f-mono);font-weight:600;font-size:14px;text-align:right}
.item .iconbtn{width:30px;height:30px}
.meal-f{padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:16px;color:var(--muted);font-size:14px;text-align:center}
.g-diet{grid-template-columns:minmax(0,7fr) minmax(0,4fr);grid-template-areas:"meals sum" "meals extra";grid-template-rows:auto 1fr;align-items:start}
.d-meals{grid-area:meals}.d-sum{grid-area:sum}.d-extra{grid-area:extra}
@media (max-width:899px){.g-diet{grid-template-columns:minmax(0,1fr);grid-template-areas:"sum" "meals" "extra";grid-template-rows:none}}
.tip-list{display:flex;flex-direction:column;gap:6px}
.tip{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid var(--line);color:inherit}
.tip .num{font-size:13px;color:var(--muted);white-space:nowrap}
.food-list{display:flex;flex-direction:column;max-height:min(50vh,460px);overflow:auto;border:1px solid var(--line);border-radius:14px}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;color:inherit}
.food:last-child{border-bottom:0}
.food:hover{background:var(--glass)}
.food .fn{font-weight:600;font-size:14px;display:block}
.food .fp{font-size:12px;color:var(--muted);display:block}
.food .fm{display:flex;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.food .fk{font-family:var(--f-mono);font-weight:600;font-size:14px;text-align:right}
.food .fk small{display:block;font-size:11px;color:var(--faint);font-weight:400}
.qty-prev{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qty-prev > div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.qty-prev .v{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.qty-prev .l{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;margin-top:4px}
.ai-drop{border:1.5px dashed rgba(60,200,230,.45);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:rgba(60,200,230,.05)}
.ai-drop svg{width:34px;height:34px;color:var(--accent)}
.ai-prev{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.ai-row{display:grid;grid-template-columns:28px minmax(0,1fr) 84px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ai-row .input{padding:6px 8px;font-size:14px;text-align:right}
.swap-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;color:inherit}
.swap-row:hover{background:var(--glass)}
.swap-row .sg{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:right}
.swap-row .sd{font-size:12px;font-family:var(--f-mono);color:var(--muted)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(2,8,12,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease}
.sheet{background:linear-gradient(180deg,#12303D,#0C222D);border:1px solid var(--glass-b);border-radius:20px;width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:rise .2s cubic-bezier(.2,.8,.2,1)}
.sheet.wide{width:min(860px,100%)}
.sheet-h{display:flex;align-items:flex-start;gap:10px}
.sheet-h h2{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.1;letter-spacing:-.02em}
.sheet-h .iconbtn{margin-left:auto}
@media (max-width:640px){
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:.6}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#E9FBFF;color:#05303C;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:200;box-shadow:var(--shadow);animation:rise .2s;max-width:calc(100% - 32px)}
@media (max-width:899px){.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.qa-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa{border:1px solid var(--line);background:rgba(0,0,0,.22);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;font-weight:600;color:inherit}
.qa:hover{border-color:var(--accent)}
.qa span{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.qa span svg{width:24px;height:24px}

/* ---------- gráficos ---------- */
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .ax{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dot2{width:8px;height:8px;border-radius:50%}
.tt{position:absolute;pointer-events:none;background:#E9FBFF;color:#05303C;font-size:12px;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-118%);box-shadow:var(--shadow);z-index:3}
.tt b{font-family:var(--f-mono)}
.chart-empty{border:1.5px dashed var(--line);border-radius:14px;padding:30px 16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.chart-empty svg{width:28px;height:28px;color:var(--faint)}

/* ---------- evolução ---------- */
.delta{font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.mgroup{display:flex;flex-direction:column;gap:10px}
.mgroup-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-top:4px}
.mgroup-h .pill{font-size:11px}
.mfield{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.mfield .mn{font-weight:600;font-size:14px}
.mfield .mh{font-size:12px;color:var(--muted)}
.mfield .input{padding:8px 10px;font-size:15px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ph-card{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:rgba(0,0,0,.3);aspect-ratio:3/4;padding:0;color:inherit}
.ph-card img{width:100%;height:100%;object-fit:cover;display:block}
.ph-card .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);font-size:12px;font-weight:700;text-align:left}
.ph-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ph-card .sel{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px}
.cmp{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:3/4}
.cmp img{width:100%;height:100%;object-fit:cover}
.cmp .cap{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);padding:3px 8px;border-radius:8px;font-size:12px;font-weight:700}
.cmp.grid-on::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(60,200,230,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(60,200,230,.45) 1px,transparent 1px);background-size:25% 12.5%;pointer-events:none}

/* ---------- treino ---------- */
.bodymap{display:flex;gap:6px;justify-content:center}
.bodymap figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;max-width:190px}
.bodymap figcaption{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.bodymap svg{width:100%;height:auto}
.bodymap .m{fill:var(--muscle);stroke:var(--bg);stroke-width:1.5;cursor:pointer;transition:fill .15s}
.bodymap .m:hover{fill:#3A6A80}
.bodymap .m.on{fill:var(--muscle-hi);filter:drop-shadow(0 0 6px rgba(60,200,230,.6))}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grp{border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:11px;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;font-size:14px}
.grp[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.grp span{font-family:var(--f-mono);font-size:12px;opacity:.7}
.exlist{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.ex{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.2);text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;color:inherit}
.ex:hover{border-color:var(--accent)}
.exi{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.exi svg{width:26px;height:26px}
.ex .exn{font-weight:700;font-size:15px;display:block}
.ex .exm{font-size:12px;color:var(--muted);margin-top:2px;display:block}
.ex .exr{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.detail h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.detail h4 svg{width:16px;height:16px;color:var(--accent)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:14px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:8px;background:var(--flame);color:var(--on-accent);font-family:var(--f-mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.blist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.blist li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14px}
.blist li svg{width:16px;height:16px;margin-top:3px}
.blist.err svg{color:var(--bad)} .blist.cue svg{color:var(--good)}
.rx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rx > div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rx .v{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1}
.rx .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.wex{border:1px solid var(--glass-b);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));overflow:hidden}
.wex-h{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-bottom:1px solid var(--line)}
.wex-h .n{font-weight:700}
.wex-h .p{font-size:12px;color:var(--muted)}
.sets{display:flex;flex-direction:column}
.set,.set-h{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 62px 38px 26px;gap:6px;align-items:center;padding:6px 12px}
.set-h{padding-top:8px;padding-bottom:0;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;text-align:center}
.set .sn{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:center}
.set .input{padding:7px 4px;font-size:15px;text-align:center}
.set select.input{padding:7px 2px;font-size:14px;text-align-last:center}
.set .ck{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:transparent}
.set .ck svg{width:18px;height:18px}
.set.done{background:rgba(61,220,151,.07)}
.set.done .ck{background:var(--lime);border-color:var(--lime);color:var(--on-accent)}
