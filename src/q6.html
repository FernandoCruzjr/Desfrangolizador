
<script>
/* ======================= DIETA ======================= */
let FP = {m:0, f:null, g:0, view:"list"};
function vDieta(){
  const p = P(), d = UI.date, c = typeof calcDay === "function" ? calcDay(p, d) : calc(p), day = getDay(d), t = dayTotals(day), isToday = d === todayISO();
  const has = day.meals.some(m => m.items.length);
  return `
  <div class="ph"><div><div class="eyebrow">Dieta flexível · IIFYM</div><h1>Diário alimentar</h1><p class="lede">Monte o dia com os alimentos que você gosta. O que importa é fechar calorias e macros.</p></div>
    <div class="daynav"><button class="iconbtn" data-act="day" data-arg="-1" aria-label="Dia anterior">${ic("chevL")}</button><span class="dl">${isToday ? "Hoje · " : ""}${DOW[parseISO(d).getDay()]}, ${dLabel(d)}</span><button class="iconbtn" data-act="day" data-arg="1" aria-label="Próximo dia">${ic("chevR")}</button>${isToday ? "" : `<button class="btn sm" data-act="day" data-arg="0">Hoje</button>`}</div></div>
  <div class="grid g-diet">
    <div class="d-meals" style="display:flex;flex-direction:column;gap:14px;min-width:0">
      ${day.meals.map((m, mi) => mealCard(m, mi)).join("")}
      <div class="row"><button class="btn" data-act="addMeal">${ic("plus")}Nova refeição</button><button class="btn" data-act="copyPrev">${ic("copy")}Copiar dia anterior</button><span class="spacer"></span>${has ? `<button class="btn ghost danger" data-act="clearDay">${ic("trash")}Limpar dia</button>` : ""}</div>
    </div>
    <aside class="d-sum" style="min-width:0">
      <section class="panel"><div class="panel-h"><h2>${ic("target")}Resumo do dia</h2><span class="pill ac">${(GOALS[p.goal] || GOALS.bulk).n}</span></div>
        <div style="display:flex;justify-content:center;margin-bottom:14px">${ring(t.k, c.kcal)}</div>
        ${c.extra && c.extra.kcal ? `<div class="note good" style="margin-bottom:12px">${ic("run")}<span><b>+${fmt(c.extra.kcal)} kcal</b> de atividades extras somadas à meta de hoje${c.extra.water ? ` e <b>+${fmt(c.extra.water)} ml</b> de água` : ""}.</span></div>` : ""}
        <div style="display:flex;flex-direction:column;gap:12px">${macroBar("Proteína","p",MC.p,t.p,c.prot)}${macroBar("Carboidrato","c",MC.c,t.c,c.carb)}${macroBar("Gordura","f",MC.f,t.f,c.fat)}</div>
      </section>
      <section class="panel"><div class="panel-h"><h2>${ic("clock")}Por refeição</h2></div>${perMealBlock(t, c, day, d)}</section>
    </aside>
    <aside class="d-extra" style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <section class="panel"><div class="panel-h"><h2>${ic("whistle")}Para fechar os macros</h2></div>${suggestions(t, c)}</section>
      <section class="panel"><div class="panel-h"><h2>${ic("pill")}Suplementos</h2></div>${suppChecklist(d)}</section>
      <section class="panel"><div class="panel-h"><h2>${ic("drop")}Água</h2><span class="pill">${fmt(c.water.total)} ml</span></div>${waterBlock(day, c)}</section>
    </aside>
  </div>`;
}
function mealCard(m, mi){
  const s = sumItems(m.items);
  return `<section class="meal"><div class="meal-h"><span class="mi">${ic(mealIcon(m.name))}</span><div style="min-width:0"><h3>${esc(m.name)} ${m.time ? `<span class="pill num">${m.time}</span>` : ""}</h3><div class="mm num"><span>P ${fmt(s.p)} g</span><span>C ${fmt(s.c)} g</span><span>G ${fmt(s.f)} g</span></div></div><span class="mk num">${fmt(s.k)}<small> kcal</small></span><button class="iconbtn" data-act="delMeal" data-m="${mi}" aria-label="Remover ${esc(m.name)}">${ic("trash")}</button></div>
  <div class="items">${m.items.length ? m.items.map((it, i) => { const x = itemMac(it); return `<div class="item"><div style="min-width:0"><div class="in">${esc(it.n)}</div><div class="im"><span><i class="dot c-p"></i>${fmt(x.p, 1)}</span><span><i class="dot c-c"></i>${fmt(x.c, 1)}</span><span><i class="dot c-f"></i>${fmt(x.f, 1)}</span></div></div><div class="row" style="gap:4px;flex-wrap:nowrap"><input class="input num" style="width:68px;padding:6px 8px;font-size:14px;text-align:right" type="number" inputmode="decimal" min="0" value="${it.g}" data-bind="itemg" data-m="${mi}" data-i="${i}" aria-label="Gramas de ${esc(it.n)}"><span class="sub">g</span></div><span class="ik">${fmt(x.k)}</span><button class="iconbtn" data-act="swapItem" data-m="${mi}" data-i="${i}" aria-label="O que posso comer no lugar de ${esc(it.n)}?" title="O que posso comer no lugar?">${ic("swap")}</button><button class="iconbtn" data-act="delItem" data-m="${mi}" data-i="${i}" aria-label="Remover ${esc(it.n)}">${ic("x")}</button></div>`; }).join("") : `<div class="empty">Nada registrado ainda.</div>`}</div>
  <div class="meal-f"><button class="btn sm ghost" data-act="pickFood" data-m="${mi}">${ic("plus")}Adicionar alimento</button><button class="btn sm ghost" data-act="aiFood" data-m="${mi}">${ic("camera")}Foto do prato</button>${m.items.length && typeof mealPostBtn === "function" ? mealPostBtn(mi) : ""}</div></section>`;
}
function suggestions(t, c){
  const rp = c.prot - t.p, rc = c.carb - t.c, rf = c.fat - t.f, out = [];
  const pick = (names, rem, key) => names.map(n => FOODS.find(f => f.n === n)).filter(Boolean).map(f => { const need = rem / f[key] * 100, cap = Math.max(f.pg * 2, 150); const g = Math.max(5, Math.round(Math.min(need, cap) / 5) * 5); return {f, g, cov: f[key] * g / 100}; });
  if (rp > 8) out.push({lbl:`Faltam ${fmt(rp)} g de proteína`, col:MC.p, items:pick(["Peito de frango grelhado","Whey protein concentrado","Atum em conserva em água","Iogurte proteico (15 g de proteína)"], rp, "p")});
  if (rc > 15) out.push({lbl:`Faltam ${fmt(rc)} g de carboidrato`, col:MC.c, items:pick(["Arroz branco cozido","Batata-doce cozida","Banana prata","Aveia em flocos"], rc, "c")});
  if (rf > 6) out.push({lbl:`Faltam ${fmt(rf)} g de gordura`, col:MC.f, items:pick(["Azeite de oliva","Pasta de amendoim integral","Castanha-do-pará","Abacate"], rf, "f")});
  if (!out.length) return t.k > c.kcal + 150 ? `<div class="note warn">${ic("alert")}<span>Você passou <b>${fmt(t.k - c.kcal)} kcal</b> da meta. Um dia não define nada: compense levemente nos próximos dias ou siga normalmente.</span></div>` : `<div class="note">${ic("trophy")}<span><b>Macros fechados.</b> Dia completo dentro da meta.</span></div>`;
  return `<div style="display:flex;flex-direction:column;gap:14px">${out.map(o => `<div><div class="row" style="gap:7px;margin-bottom:6px;font-weight:700;font-size:14px"><i class="dot" style="background:${o.col}"></i>${o.lbl}</div><div class="tip-list">${o.items.map(x => `<button class="tip" style="border:0;text-align:left;width:100%" data-act="quickAdd" data-f="${x.f.id}" data-g="${x.g}"><span>${esc(x.f.n)}</span><span class="num">${x.g} g <span style="color:${o.col}">+${fmt(x.cov)}</span> ${ic("plus", 'style="width:14px;height:14px;display:inline;vertical-align:-2px"')}</span></button>`).join("")}</div></div>`).join("")}<p class="sub">Quantidades em porções realistas; o número colorido é quanto cada opção cobre. Toque para adicionar à próxima refeição.</p></div>`;
}
/* o que falta no dia dividido pelas refeições que ainda vão acontecer */
function remainingMeals(day, d){
  const left = day.meals.filter(m => !m.items.length);
  if (d !== todayISO()) return left;
  const nm = new Date().getHours() * 60 + new Date().getMinutes();
  return left.filter(m => !m.time || toMin(m.time) >= nm - 60);
}
function remCount(day, d){ return UI.remN && UI.remN.d === d ? UI.remN.n : Math.max(1, remainingMeals(day, d).length); }
function perMealBlock(t, c, day, d){
  const rk = Math.max(0, c.kcal - t.k), rp = Math.max(0, c.prot - t.p), rc = Math.max(0, c.carb - t.c), rf = Math.max(0, c.fat - t.f);
  if (rk < 80 && rp < 8) return `<div class="note">${ic("trophy")}<span><b>Nada a dividir.</b> Calorias e proteína do dia já estão fechadas.</span></div>`;
  const left = remainingMeals(day, d), n = remCount(day, d), base = c.kcal / Math.max(1, day.meals.length), per = rk / n, w = +P().weight || 70;
  const names = left.length && !(UI.remN && UI.remN.d === d) ? left.map(m => esc(m.name)).join(", ") : "";
  const tips = [];
  if (per > base * 1.4) tips.push(`Cada refeição ficou <b>${fmt(per / base * 100 - 100)}% maior</b> que o normal. Sem apetite? Use comida densa: shake de whey com aveia, banana e pasta de amendoim, azeite no prato, castanhas, granola. Líquido desce mais fácil.`);
  if (rp / n > Math.max(50, w * 0.6)) tips.push(`Mais de ${fmt(Math.max(50, w * 0.6))} g de proteína por refeição é difícil de comer. Vale criar uma refeição extra (um shake já resolve).`);
  return `<div class="row" style="margin-bottom:10px;gap:8px"><div style="flex:1;min-width:0"><div style="font-weight:700">Faltam <span class="num">${n}</span> refeiç${n === 1 ? "ão" : "ões"}</div>${names ? `<div class="sub">${names}</div>` : ""}</div><button class="iconbtn" data-act="remN" data-arg="-1" aria-label="Menos uma refeição">${ic("minus")}</button><button class="iconbtn" data-act="remN" data-arg="1" aria-label="Mais uma refeição">${ic("plus")}</button></div>
  <div class="qty-prev"><div><div class="v num">${fmt(per)}</div><div class="l">kcal</div></div><div><div class="v num">${fmt(rp / n)}</div><div class="l"><i class="dot c-p"></i>Proteína</div></div><div><div class="v num">${fmt(rc / n)}</div><div class="l"><i class="dot c-c"></i>Carbo</div></div><div><div class="v num">${fmt(rf / n)}</div><div class="l"><i class="dot c-f"></i>Gordura</div></div></div>
  <p class="sub" style="margin-top:8px">Média por refeição para fechar o dia: faltam ${fmt(rk)} kcal, ${fmt(rp)} g de proteína, ${fmt(rc)} g de carbo e ${fmt(rf)} g de gordura.</p>
  ${tips.map(x => `<div class="note warn" style="margin-top:8px">${ic("alert")}<span>${x}</span></div>`).join("")}`;
}
function nextMealIndex(day){
  if (UI.date !== todayISO()) return 0;
  const nm = new Date().getHours() * 60 + new Date().getMinutes();
  let idx = day.meals.findIndex(m => m.time && toMin(m.time) >= nm - 45);
  return idx < 0 ? day.meals.length - 1 : idx;
}
/* seletor de alimentos */
function openPicker(m, fid, g){ FP = {m, f:fid || null, g:g || 0, view:"list"}; if (fid && !g) FP.g = findFood(fid).pg; renderPicker(); }
function renderPicker(){
  const day = getDay(UI.date), meal = day.meals[FP.m] || day.meals[0];
  if (FP.view === "new") return openModal(newFoodForm(meal));
  if (FP.f) return openModal(qtyView(meal));
  const fd = foodsDoc();
  const cats = [["all","Todos"],["fav","Favoritos"],["recent","Recentes"],["mine","Meus alimentos"]].concat(Object.entries(FOOD_CATS));
  openModal(`${sheetHead("Adicionar alimento", esc(meal ? meal.name : ""))}
    <div class="input-u"><input id="fq" class="input" type="search" placeholder="Buscar: frango, arroz, whey, banana…" value="${esc(UI.q)}" data-bind="fq" autofocus autocomplete="off"><span>${ic("search", 'style="width:18px;height:18px"')}</span></div>
    <div class="chips">${cats.map(([k, n]) => `<button class="chip" data-act="fcat" data-arg="${k}" aria-pressed="${UI.fcat === k}">${k === "fav" ? ic("star", 'style="width:14px;height:14px"') : ""}${n}</button>`).join("")}</div>
    <div class="food-list" id="food-list">${foodRows()}</div>
    <div class="row"><span class="sub">${FOODS.length + fd.custom.length} alimentos · valores por porção</span><span class="spacer"></span><button class="btn sm" data-act="newFood">${ic("plus")}Criar alimento</button></div>`);
}
function foodRows(){
  const fd = foodsDoc(), q = norm(UI.q.trim()), words = q.split(/\s+/).filter(Boolean);
  let list = allFoods();
  if (UI.fcat === "fav") list = fd.fav.map(findFood).filter(Boolean);
  else if (UI.fcat === "recent") list = fd.recent.map(findFood).filter(Boolean);
  else if (UI.fcat === "mine") list = fd.custom;
  else if (UI.fcat !== "all") list = list.filter(f => f.cat === UI.fcat);
  if (words.length) list = list.filter(f => { const n = norm(f.n); return words.every(w => n.includes(w)); });
  if (!list.length) return `<div class="empty">${UI.fcat === "fav" ? "Nenhum favorito. Toque na estrela de um alimento para guardar." : UI.fcat === "recent" ? "Os alimentos que você adicionar aparecem aqui." : "Nada encontrado. Que tal criar esse alimento?"}</div>`;
  return list.slice(0, 150).map(f => { const r = f.pg / 100; return `<button class="food" data-act="selFood" data-f="${f.id}"><span style="min-width:0"><span class="fn" style="display:block">${fd.fav.includes(f.id) ? "★ " : ""}${esc(f.n)}</span><span class="fp" style="display:block">${esc(f.pl)} · ${fmt(f.pg)} g</span><span class="fm"><span style="color:var(--prot)">P ${fmt(f.p * r, 1)}</span><span style="color:var(--carb)">C ${fmt(f.c * r, 1)}</span><span style="color:var(--fat)">G ${fmt(f.f * r, 1)}</span></span></span><span class="fk">${fmt(f.k * r)}<small>kcal</small></span></button>`; }).join("");
}
function qtyPrev(f, g){ const r = (+g || 0) / 100; return `<div><div class="v num">${fmt(f.k * r)}</div><div class="l">kcal</div></div><div><div class="v num">${fmt(f.p * r, 1)}</div><div class="l"><i class="dot c-p"></i>Proteína</div></div><div><div class="v num">${fmt(f.c * r, 1)}</div><div class="l"><i class="dot c-c"></i>Carbo</div></div><div><div class="v num">${fmt(f.f * r, 1)}</div><div class="l"><i class="dot c-f"></i>Gordura</div></div>`; }
function qtyView(meal){
  const f = findFood(FP.f), fav = foodsDoc().fav.includes(f.id);
  return `${sheetHead(esc(f.n), esc(FOOD_CATS[f.cat] || "Meu alimento"))}
  <div class="chips">${[[0.5,"½ porção"],[1,"1 porção"],[1.5,"1½ porção"],[2,"2 porções"]].map(([m, l]) => `<button class="chip" data-act="qtySet" data-g="${Math.round(f.pg * m)}" aria-pressed="${+FP.g === Math.round(f.pg * m)}">${l}</button>`).join("")}</div>
  <p class="sub">1 porção = ${esc(f.pl)} (${fmt(f.pg)} g)</p>
  <div class="row" style="flex-wrap:nowrap"><button class="iconbtn" style="border-color:var(--line)" data-act="qtyStep" data-arg="-10" aria-label="Menos 10 g">${ic("minus")}</button><div class="input-u" style="flex:1"><input id="qg" class="input num" type="number" inputmode="decimal" min="0" value="${FP.g}" data-bind="qg" aria-label="Quantidade em gramas" autofocus><span>g</span></div><button class="iconbtn" style="border-color:var(--line)" data-act="qtyStep" data-arg="10" aria-label="Mais 10 g">${ic("plus")}</button></div>
  <div class="qty-prev" id="qprev">${qtyPrev(f, FP.g)}</div>
  <p class="sub num">Por 100 g: ${fmt(f.k)} kcal · P ${fmt(f.p, 1)} · C ${fmt(f.c, 1)} · G ${fmt(f.f, 1)}</p>
  <div class="row"><button class="btn ghost" data-act="pickBack">${ic("chevL")}Voltar</button><button class="iconbtn" data-act="fav" data-f="${f.id}" aria-label="${fav ? "Remover dos favoritos" : "Favoritar"}" style="${fav ? "color:var(--accent-ink)" : ""}">${ic("star", fav ? 'style="fill:currentColor"' : "")}</button><span class="spacer"></span><button class="btn primary" data-act="addFood">${ic("plus")}Adicionar ${meal ? "ao " + esc(meal.name.toLowerCase()) : ""}</button></div>`;
}
function newFoodForm(){
  const nf = (k, l, u, v = "") => `<div class="field"><label for="nf-${k}">${l}</label><div class="input-u"><input id="nf-${k}" class="input num" type="number" inputmode="decimal" min="0" step="0.1" value="${v}"><span>${u}</span></div></div>`;
  return `${sheetHead("Criar alimento","Meus alimentos")}
  <div class="field"><label for="nf-n">Nome</label><input id="nf-n" class="input" type="text" placeholder="Ex.: Pão caseiro da padaria" autofocus></div>
  <div class="fields"><div class="field"><label for="nf-pl">Porção</label><input id="nf-pl" class="input" type="text" placeholder="1 fatia" value="1 porção"></div>${nf("pg","Peso da porção","g","100")}</div>
  <div class="field"><span class="lbl">Valores informados por</span><div class="seg"><button data-act="nfMode" data-v="100" aria-pressed="${FP.nfMode !== "porcao"}">100 g</button><button data-act="nfMode" data-v="porcao" aria-pressed="${FP.nfMode === "porcao"}">Porção (como no rótulo)</button></div></div>
  <div class="fields">${nf("k","Calorias","kcal")}${nf("p","Proteína","g")}${nf("c","Carboidrato","g")}${nf("f","Gordura","g")}</div>
  <p class="sub" id="nf-err" style="color:var(--bad)"></p>
  <div class="row"><button class="btn ghost" data-act="pickBack">${ic("chevL")}Voltar</button><span class="spacer"></span><button class="btn primary" data-act="saveFood">${ic("check")}Salvar alimento</button></div>`;
}

/* ======================= EVOLUÇÃO ======================= */
function weeklyRate(ms){
  const w = ms.filter(m => +m.weight); if (w.length < 2) return null;
  const last = w[w.length - 1], lim = addDays(last.date, -7);
  const prev = [...w].reverse().find(m => m.date <= lim) || w[0]; if (prev === last) return null;
  const days = (parseISO(last.date) - parseISO(prev.date)) / 864e5; if (days < 3) return null;
  const kg = (last.weight - prev.weight) / days * 7; return {kg, pct: kg / prev.weight * 100};
}
function rateStatus(goal, pct){
  if (goal === "bulk") return pct < 0.1 ? ["warn","Lento: some 100–150 kcal"] : pct > 0.75 ? ["warn","Rápido: risco de ganhar gordura"] : ["good","No ritmo ideal"];
  if (goal === "cut") return pct > -0.25 ? ["warn","Lento: reduza 100–150 kcal"] : pct < -1.2 ? ["warn","Rápido demais: risco de perder massa"] : ["good","No ritmo ideal"];
  return Math.abs(pct) < 0.3 ? ["good","Peso estável"] : ["warn","Peso oscilando"];
}
function vEvolucao(){
  const p = P(), ms = measures(), wl = ms.filter(m => +m.weight), last = wl[wl.length - 1], first = wl[0];
  const rate = weeklyRate(ms), imc = last ? last.weight / ((p.height / 100) ** 2) : null;
  const lastAny = ms[ms.length - 1] || {};
  const bfRec = [...ms].reverse().map(m => ({m, b:bfOf(p, m)})).find(x => x.b);
  const lean = bfRec && last ? last.weight * (1 - bfRec.b.v / 100) : null;
  const wh = [...ms].reverse().find(m => +m.waist && +m.hip), whr = wh ? wh.waist / wh.hip : null, whrLim = p.sex === "m" ? 0.9 : 0.85;
  const wPts = wl.map(m => ({x:m.date, y:+m.weight})), avg7 = movingAvg(wPts), avgNow = avg7.length ? avg7[avg7.length - 1].y : null;
  const avail = CHART_FIELDS.filter(k => ms.some(m => +m[k])).map(k => MFIELDS.find(f => f[0] === k));
  if (!avail.find(a => a[0] === UI.metric) && avail.length) UI.metric = avail[0][0];
  const mf = MFIELDS.find(x => x[0] === UI.metric) || MFIELDS[0];
  const pts = ms.filter(m => +m[mf[0]]).map(m => ({x:m.date, y:+m[mf[0]]}));
  const series = mf[0] === "weight" ? [{pts, color:"var(--faint)", name:"Pesagens", dots:true, noLine:true, noEnd:true}, {pts:avg7, color:"var(--accent)", name:"Média móvel 7 dias", area:true}] : [{pts, color:"var(--accent)", name:mf[1], area:true, dots:true}];
  const rs = rate ? rateStatus(p.goal, rate.pct) : null;
  const imcCat = imc == null ? "" : imc < 18.5 ? "abaixo do peso" : imc < 25 ? "eutrófico" : imc < 30 ? "sobrepeso" : "obesidade";
  const ph = photos(), sel = UI.sel.filter(k => ph.some(x => x.key === k));
  const cmp = sel.length === 2 ? sel.map(k => ph.find(x => x.key === k)).sort((a, b) => a.date.localeCompare(b.date)) : null;
  const histCols = CHART_FIELDS.filter(k => ms.some(m => +m[k])).map(k => MFIELDS.find(f => f[0] === k));
  return `
  <div class="ph"><div><div class="eyebrow">Métricas corporais · meu progresso</div><h1>Evolução</h1><p class="lede">A fita métrica e as fotos mostram o que a balança esconde. Meça a cada 1–2 semanas, pela manhã, em jejum e antes de treinar.</p></div><div class="row"><button class="btn" data-act="photoNew">${ic("camera")}Foto</button><button class="btn primary" data-act="scrollForm">${ic("plus")}Registrar medidas</button></div></div>
  <section class="panel"><div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    <div class="stat"><span class="lbl">Peso (média 7 dias)</span><div class="v num">${avgNow ? fmt(avgNow, 1) : "—"}<small>kg</small></div><div class="d">${last ? `última pesagem ${fmt(last.weight, 1)} kg` : "sem registro"}</div></div>
    <div class="stat"><span class="lbl">Desde o início</span><div class="v num">${last && first ? (last.weight - first.weight >= 0 ? "+" : "") + fmt(last.weight - first.weight, 1) : "—"}<small>kg</small></div><div class="d">${first ? "desde " + dLabel(first.date) : "—"}</div></div>

  const hist = allSessions().filter(s => s.ex.some(x => x.id === id)).reverse().map(s => { const x = s.ex.find(y => y.id === id); const b = Math.max(0, ...x.sets.map(st => e1rm(+st.kg || 0, +st.r || 0))); return {x:s.date, y:Math.round(b * 10) / 10}; }).filter(p => p.y > 0);
  const best = hist.length ? Math.max(...hist.map(h => h.y)) : 0;
  openModal(`${sheetHead(esc(e.n), GN[e.g] + (e.s && typeof SUBN === "function" ? " · " + SUBN(e.g, e.s) : ""))}
    <div class="row"><span class="pill">${ic("eq_" + e.eq, 'style="width:14px;height:14px"')}${EQN[e.eq]}</span><span class="pill ac">${e.lvl}</span></div>
    <div class="row" style="gap:8px;flex-wrap:wrap"><a class="btn primary" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.n + " execução correta")}" target="_blank" rel="noopener">${ic("video")}Ver vídeo no YouTube</a>${typeof addToFichaModal === "function" ? `<button class="btn" data-act="fToFicha" data-arg="${e.id}">${ic("list")}Adicionar à minha ficha</button>` : ""}</div>
    <p class="small"><b>Principal:</b> ${esc(e.prim)}<br><span class="muted"><b>Auxiliares:</b> ${esc(e.sec)}</span></p>
    <div class="rx"><div><div class="l">Séries</div><div class="v num">${e.rx[0]}</div></div><div><div class="l">Repetições</div><div class="v num">${e.rx[1]}</div></div><div><div class="l">Descanso</div><div class="v num">${e.rx[2]}</div></div></div>
    <div class="grid g2 detail"><div><h4>${ic("list")}Execução passo a passo</h4><ol class="steps">${e.how.map(x => `<li><span>${esc(x)}</span></li>`).join("")}</ol></div>
      <div style="display:flex;flex-direction:column;gap:16px"><div><h4>${ic("alert")}Erros comuns</h4><ul class="blist err">${e.err.map(x => `<li>${ic("x")}<span>${esc(x)}</span></li>`).join("")}</ul></div><div><h4>${ic("whistle")}Dicas do coach</h4><ul class="blist cue">${e.cue.map(x => `<li>${ic("check")}<span>${esc(x)}</span></li>`).join("")}</ul></div></div></div>
    ${hist.length ? `<div><h4 class="lbl" style="margin-bottom:6px">Sua progressão · 1RM estimado (Epley)</h4><p class="sub">Melhor marca: <b class="num">${fmt(best, 1)} kg</b></p>${lineChart(hist, {h:180, unit:"kg", label:"1RM estimado"})}</div>` : ""}
    <div class="row"><span class="spacer"></span><button class="btn primary" data-act="addEx" data-arg="${e.id}">${ic("plus")}${draft() ? "Adicionar ao treino atual" : "Começar treino com este exercício"}</button></div>`, "wide");
}

/* ======================= CRONÔMETRO & AVISOS ======================= */
let AC = null;
function initAudio(){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch(e){} }
function beep(times = 2){
  try { if (!AC) return; let t = AC.currentTime; for (let i = 0; i < times; i++) { const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = i % 2 ? 1046 : 880; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.25); t += 0.3; } } catch(e){}
  try { navigator.vibrate && navigator.vibrate([180, 80, 180]); } catch(e){}
}
const TIMER = {end:0, iv:null};
function startTimer(sec){ TIMER.end = Date.now() + sec * 1000; clearInterval(TIMER.iv); TIMER.iv = setInterval(drawTimer, 250); drawTimer(); }
function stopTimer(){ clearInterval(TIMER.iv); TIMER.end = 0; $("#timerRoot").innerHTML = ""; }
function drawTimer(){
  const left = Math.max(0, Math.ceil((TIMER.end - Date.now()) / 1000));
  if (!left) { stopTimer(); beep(3); toast("Descanso concluído. Próxima série!"); return; }
  $("#timerRoot").innerHTML = `<div class="timer" role="timer">${ic("timer", 'style="width:22px;height:22px"')}<span class="tv num">${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}</span><button class="iconbtn" data-act="timerAdd" aria-label="Mais 15 segundos">${ic("plus")}</button><button class="iconbtn" data-act="timerStop" aria-label="Parar cronômetro">${ic("x")}</button></div>`;
}
function todaysEvents(p){
  const ev = [];
  if (p.remMeals) mealPlan(p).forEach(m => ev.push({t:m.time, kind:"meal", label:m.name}));
  if (p.remWater) waterPlan(p).forEach(w => ev.push({t:w.time, kind:"water", label:`beber ${w.ml} ml de água`, ml:w.ml}));
  if (p.remSupps) (p.supps || []).filter(s => s.time && s.n).forEach(s => ev.push({t:s.time, kind:"supp", label:`${s.n} (${s.dose})`, sid:s.id}));
  return ev.sort((a, b) => a.t.localeCompare(b.t));
}
const FIRED = new Set();
function checkReminders(){
  const p = P(); if (!p.remMeals && !p.remWater) return;
  const now = new Date(), hm = toHM(now.getHours() * 60 + now.getMinutes()), key = todayISO();
  todaysEvents(p).forEach(e => { if (e.t === hm) { const id = key + e.t + e.kind; if (!FIRED.has(id)) { FIRED.add(id); fireReminder(e); } } });
}
function fireReminder(e){
  const water = e.kind === "water", supp = e.kind === "supp", title = water ? "Hora de beber água" : supp ? "Hora do suplemento: " + e.label : "Hora de comer: " + e.label;
  const body = water ? `Beba ${e.ml} ml agora para chegar na meta do dia.` : supp ? "Tome agora e marque no checklist do dia." : "Abra a dieta e registre a refeição para não perder os macros.";
  if (supp) { document.getElementById("remRoot").innerHTML = `<div class="reminder" role="alert"><span class="ri">${ic("pill")}</span><div style="flex:1;min-width:0"><div class="rt">${esc(title)}</div><div class="rd">${esc(body)}</div><div class="row" style="margin-top:10px"><button class="btn primary sm" data-act="suppDone" data-arg="${e.sid}" data-d="${todayISO()}" data-close="1">${ic("check")}Tomei</button><button class="btn sm ghost" data-act="remClose">Dispensar</button></div></div></div>`; beep(4); try { if ("Notification" in window && Notification.permission === "granted") new Notification(title, {body}); } catch(err){} return; }
  document.getElementById("remRoot").innerHTML = `<div class="reminder" role="alert"><span class="ri">${ic(water ? "drop" : mealIcon(e.label))}</span><div style="flex:1;min-width:0"><div class="rt">${esc(title)}</div><div class="rd">${esc(body)}</div><div class="row" style="margin-top:10px">${water ? `<button class="btn primary sm" data-act="remWater" data-arg="${e.ml}">${ic("plus")}Registrar ${e.ml} ml</button>` : `<button class="btn primary sm" data-act="remMeal">${ic("plate")}Abrir dieta</button>`}<button class="btn sm ghost" data-act="remClose">Dispensar</button></div></div></div>`;
  beep(4);
  try { if ("Notification" in window && Notification.permission === "granted") new Notification(title, {body}); } catch(err){}
}
function askNotify(){ try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {}); } catch(e){} }

});

    if (k === "bf") { const v = parseFloat(raw); setP({bf: v > 0 ? v : ""}); }
    else { const v = parseFloat(raw); if (!(v > 0) && k !== "trainMin") return; setP({[k]: isNaN(v) ? 0 : v}); }
    clearTimeout(pT); pT = setTimeout(refreshPlano, 60);
  } else if (b === "fq") { UI.q = el.value; const l = $("#food-list"); if (l) l.innerHTML = foodRows(); }
  else if (b === "qg") { FP.g = parseFloat(el.value) || 0; $("#qprev").innerHTML = qtyPrev(findFood(FP.f), FP.g); }
  else if (b === "setkg" || b === "setr") { const d = draft(); d.ex[+el.dataset.e].sets[+el.dataset.s][b === "setkg" ? "kg" : "r"] = el.value; saveDraft(d); }
  else if (b === "dname") { const d = draft(); d.name = el.value; saveDraft(d); }
  else if (b === "nick") { setP({nick: el.value.trim()}); }
  else if (b === "supp") { const p = P(), ss = JSON.parse(JSON.stringify(p.supps || [])); ss[+el.dataset.i][el.dataset.k] = el.value; setP({supps: ss}); }
  else if (b === "aig") { AIF.items[+el.dataset.i].g = parseFloat(el.value) || 0; }
});
document.addEventListener("change", ev => {
  const el = ev.target, b = el.dataset && el.dataset.bind; if (!b) return;
  if (b === "itemg") { const g = parseFloat(el.value); updDay(day => { const it = day.meals[+el.dataset.m].items[+el.dataset.i]; if (g > 0) it.g = g; }); }
  else if (b === "t") { if (el.value) { setP({[el.dataset.k]: el.value}); render(); } }
  else if (b === "rpe") { const d = draft(); d.ex[+el.dataset.e].sets[+el.dataset.s].rpe = el.value; saveDraft(d); }
  else if (b === "agenda") { const ag = Object.assign({}, P().agenda || {}); if (el.value) ag[el.dataset.w] = el.value; else delete ag[el.dataset.w]; setP({agenda: ag}); render(); }
  else if (b === "aifile") { const f = el.files && el.files[0]; if (f) { AIF.file = f; AIF.url = URL.createObjectURL(f); aiFoodModal(); } }
  else if (b === "aion") { AIF.items[+el.dataset.i].on = el.checked; }
  else if (b === "phfile") { const f = el.files && el.files[0]; if (f) savePhoto(f); }
  else if (b === "mealtime") { if (!el.value) return; const mt = mealPlan(P()).map(m => m.time); mt[+el.dataset.i] = el.value; setP({mealTimes: mt}); render(); }
});
