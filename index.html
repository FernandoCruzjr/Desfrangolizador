<style>
/* Layout: painel escuro de academia — barra lateral no desktop, barra inferior com botão central no celular; cartões de vidro sobre um fundo azul-petróleo. Tema único (escuro) por escolha. */
:root{
  color-scheme:dark;
  --bg:#06131B; --bg-glow1:rgba(32,150,160,.22); --bg-glow2:rgba(30,90,170,.20);
  --surface:#0E222D; --surface2:#15303D; --surface3:#1B3B4A; --glass:rgba(255,255,255,.045); --glass-b:rgba(255,255,255,.085);
  --ink:#EAF3F5; --muted:#92ADB7; --faint:#5E7D88; --line:#1E3C4A;
  --accent:#3CC8E6; --accent-ink:#78DDF2; --accent-soft:rgba(60,200,230,.14); --on-accent:#032029;
  --lime:#3DDC97; --flame:linear-gradient(135deg,#3DDC97,#3CC8E6);
  --prot:#E8763F; --carb:#3D95F5; --fat:#27B07E; --kcal:#3CC8E6;
  --good:#3DDC97; --warn:#F2B14A; --bad:#F06A5C;
  --body:#173543; --muscle:#25495A; --muscle-hi:#3CC8E6;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:18px; --r-sm:11px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg) radial-gradient(1200px 700px at 85% -10%,var(--bg-glow1),transparent 60%) fixed,radial-gradient(900px 600px at -10% 110%,var(--bg-glow2),transparent 60%) fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
a{color:var(--accent-ink)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--glass-b);background:rgba(6,19,27,.6);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.brand-mark{width:42px;height:42px;flex:none;border-radius:11px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:11px;color:var(--accent-ink);font-weight:600;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600;text-align:left}
.nav button svg{width:21px;height:21px;flex:none}
.nav button:hover{background:var(--glass);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(60,200,230,.25)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--faint)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.ok i{background:var(--good);box-shadow:0 0 8px var(--good)} .sync.err i{background:var(--bad)}

.main{min-width:0;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--flame);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:18px;flex:none;border:2px solid rgba(255,255,255,.15)}
.hello{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.1}
.hello b{font-weight:800;text-transform:uppercase}
.hello-sub{font-size:13px;color:var(--muted)}
.topbar .iconbtn{margin-left:auto;position:relative}
.topbar .iconbtn .badge{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tabbar{display:none}
.mtop{display:none}

@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop .brand{padding:0}.mtop .brand-mark{width:30px;height:30px;border-radius:8px}.mtop .brand-name{font-size:15px}
  .main{padding-block:12px 120px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(9,26,35,.92);backdrop-filter:blur(14px);border-top:1px solid var(--glass-b);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 9px;font-size:11px;font-weight:600;color:var(--faint)}
  .tabbar button svg{width:23px;height:23px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar .fab{position:relative;top:-16px;padding:0;align-self:center}
  .fab span{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#1B4F66,#0B2A3A);border:2px solid var(--accent);box-shadow:0 0 0 5px rgba(6,19,27,.9),0 0 22px rgba(60,200,230,.45);display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .fab span svg{width:28px;height:28px}
}

/* ---------- títulos ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.ph h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em}
.ph .lede{color:var(--muted);max-width:62ch;margin-top:6px}
.sec-t{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin-top:6px}

/* ---------- cartões ---------- */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--glass-b);border-radius:var(--r);padding:18px;min-width:0;backdrop-filter:blur(10px)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;font-family:var(--f-display);letter-spacing:-.01em}
.panel-h h2 svg{width:19px;height:19px;color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-calc{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.g-evo{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}
.g-dash{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
@media (max-width:899px){.g2,.g3,.g-calc,.g-evo{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g-dash{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}

/* ---------- botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--glass-b);background:var(--glass);padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:rgba(255,255,255,.2)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--flame);border-color:transparent;color:var(--on-accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.pill-cta{border-radius:999px;background:linear-gradient(180deg,#E9FBFF,#BFEFF8);color:#05303C;font-weight:800;letter-spacing:.02em;text-transform:uppercase;font-size:13px;border:0;padding:11px 18px}
.btn.dark{background:var(--surface3);border-color:var(--surface3)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--glass)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;border:1px solid transparent;background:none;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--glass);color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.input,select.input{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.22);border-radius:11px;padding:10px 12px;font-size:16px;min-width:0;color:var(--ink)}
.input::placeholder{color:var(--faint)}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.input-u{position:relative}
.input-u .input{padding-right:46px}
.input-u > span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--faint);pointer-events:none}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:inline-flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface3);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(60,200,230,.35)}
input[type=range]{width:100%;accent-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:rgba(60,200,230,.45)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted)}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.pill.ac{background:var(--accent-soft);color:var(--accent-ink)}
.note{display:flex;gap:10px;align-items:flex-start;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--accent)}
.note b{color:var(--ink)}
.note.warn svg{color:var(--warn)}
.note.good svg{color:var(--lime, #3DDC97)}
.feat{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}.feat-i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-b);color:var(--accent)}.feat-i svg{width:20px;height:20px}.feat-hero{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(90deg,rgba(61,220,151,.14),rgba(60,200,230,.12));border:1px solid rgba(60,200,230,.3);border-radius:14px;padding:12px 14px;font-size:14px}
.banner b{color:var(--accent-ink)}
.muted{color:var(--muted)} .small{font-size:13px} .hide{display:none!important}

/* ---------- números e macros ---------- */
.stat .lbl{display:block;margin-bottom:4px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em}
.stat .v small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.stat .d{font-size:13px;color:var(--muted);margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mbar{display:flex;flex-direction:column;gap:6px}
.mbar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.mbar-top b{font-weight:700;display:inline-flex;align-items:center;gap:7px}
.mbar-top b i{width:10px;height:10px;border-radius:3px;display:inline-block}
.track{height:10px;border-radius:99px;background:rgba(0,0,0,.3);border:1px solid var(--line);overflow:hidden;position:relative}
.track > span{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.track.over > span{background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.3) 5px 8px)}
.mbar .rest{font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.c-p{background:var(--prot)} .c-c{background:var(--carb)} .c-f{background:var(--fat)} .c-k{background:var(--kcal)}
.ring{position:relative;width:170px;height:170px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr .v{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1}
.ring .ctr .l{font-size:12px;color:var(--muted)}
.ring circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- início ---------- */
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.tile:hover{border-color:rgba(60,200,230,.35)}
.tile-t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.tile-t svg{width:16px;height:16px;color:var(--accent)}
.hyd{align-items:center;justify-content:center;text-align:center}
.hyd-ring{position:relative;width:min(150px,100%);aspect-ratio:1;max-width:100%}
.hyd-ring svg{width:100%;height:100%}
.hyd-ring .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.hyd-ring .ic svg{width:34%;height:34%}
.minibars{display:flex;align-items:flex-end;gap:6px;height:64px}
.minibars > div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.minibars i{display:block;width:100%;border-radius:4px 4px 2px 2px;min-height:3px}
.minibars span{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.wk-card{display:flex;align-items:center;gap:12px}
.wk-ic{width:44px;height:44px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.wk-ic svg{width:24px;height:24px}
.wk-t{font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.02em}
.wk-s{font-size:13px;color:var(--muted)}
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekdots div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.weekdots i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal}
.weekdots i svg{width:15px;height:15px}
.weekdots .done i{background:var(--flame);border-color:transparent;color:var(--on-accent)}
.weekdots .today i{border-color:var(--accent);box-shadow:0 0 10px rgba(60,200,230,.4)}
.meals-mini{display:flex;flex-direction:column;gap:8px}
.mm-card{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;color:inherit}
.mm-card .t{font-weight:700;font-size:14px}
.mm-card .s{font-size:12px;color:var(--muted)}
.mm-card .x{margin-left:auto;color:var(--muted)}
.mm-card .x svg{width:16px;height:16px}
.mm-card .mi{width:32px;height:32px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.mm-card .mi svg{width:17px;height:17px}
.level{display:flex;gap:16px;align-items:center}
.level-badge{width:66px;height:66px;flex:none;border-radius:18px;background:var(--flame);display:flex;align-items:center;justify-content:center;color:var(--on-accent);box-shadow:0 0 24px rgba(61,220,151,.35)}
.level-badge svg{width:36px;height:36px}
.level-n{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.xp{height:10px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.xp span{display:block;height:100%;background:var(--flame);border-radius:99px}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.ladder div{font-size:11px;text-align:center;color:var(--faint);font-weight:700;padding:6px 2px;border-radius:8px;border:1px solid var(--line)}
.ladder .on{color:var(--on-accent);background:var(--flame);border-color:transparent}
.ladder .past{color:var(--accent-ink);border-color:rgba(60,200,230,.35)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bdg{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--faint);background:rgba(0,0,0,.18)}
.bdg svg{width:22px;height:22px;flex:none}
.bdg b{display:block;font-size:13px}
.bdg.on{color:var(--ink);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.08)}
.bdg.on svg{color:var(--lime)}
.report{white-space:pre-wrap;font-size:14px;line-height:1.6}
.diag{display:flex;flex-direction:column;gap:8px}
.diag div{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:14px}
.diag svg{width:18px;height:18px;margin-top:2px}
.diag .ok svg{color:var(--good)} .diag .bad svg{color:var(--warn)}

/* ---------- plano ---------- */
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.goals{grid-template-columns:minmax(0,1fr)}}
.goal{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:rgba(0,0,0,.2);text-align:left;display:flex;flex-direction:column;gap:6px}
.goal:hover{border-color:var(--faint)}
.goal[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px rgba(60,200,230,.18)}
.goal .gi{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.goal[aria-pressed="true"] .gi{background:var(--flame);color:var(--on-accent)}
.goal .gi svg{width:20px;height:20px}
.goal .gt{font-weight:700}
.goal .gk{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.goal .gk small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600}
.goal .gd{font-size:12px;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.2);text-align:left}
.act[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.act .af{font-family:var(--f-mono);font-size:13px;font-weight:600;background:var(--surface2);border-radius:6px;padding:2px 7px;flex:none}
.act[aria-pressed="true"] .af{background:var(--accent);color:var(--on-accent)}
.act .at{font-weight:600;font-size:14px}
.act .ad{font-size:12px;color:var(--muted)}
.energy{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.energy > div{flex:1;padding:14px;min-width:0}
.energy > div + div{border-left:1px solid var(--line)}
.energy .v{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.energy .t{font-size:12px;color:var(--muted)}
.energy .hl{background:var(--accent-soft)}
.energy .hl .v{color:var(--accent-ink)}
@media (max-width:420px){.energy .v{font-size:21px}.energy > div{padding:12px 10px}}
.stack{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}
.stack > div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;min-width:0;overflow:hidden;white-space:nowrap;transition:flex-grow .4s}
.slider-row{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:12px;align-items:center}
.slider-row .sv{font-family:var(--f-mono);font-size:13px;text-align:right}
@media (max-width:520px){.slider-row{grid-template-columns:minmax(0,1fr) 84px}.slider-row input{grid-column:1/-1;grid-row:2}}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mtable td:first-child{font-family:var(--f-body);font-weight:600}
.mtable tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.switch{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.switch .sw{width:44px;height:26px;border-radius:99px;background:var(--surface3);position:relative;flex:none;transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#DDE9EC;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.switch[aria-pressed="true"] .sw{background:var(--lime)}
.switch[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.switch .st{font-weight:600;font-size:14px}
.switch .sd{font-size:12px;color:var(--muted)}
.switch > svg{width:22px;height:22px;color:var(--accent);flex:none}
.mt-list{display:flex;flex-direction:column;gap:8px}
.mt{display:grid;grid-template-columns:34px minmax(0,1fr) 136px;gap:10px;align-items:center}
.mt .mi{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.mt .mi svg{width:18px;height:18px}
.mt .input{padding:7px 10px;font-size:15px}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:rgba(0,0,0,.2)}
.wchip svg{width:13px;height:13px;color:var(--carb)}
.cal-links{display:flex;flex-wrap:wrap;gap:6px}
.cal-links a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:rgba(0,0,0,.2)}
.cal-links a:hover{border-color:var(--accent)}
.cal-links a svg{width:14px;height:14px;color:var(--accent)}
.supp{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 110px 38px;gap:8px;align-items:center}
.supp .input{padding:7px 10px;font-size:14px}
@media (max-width:520px){.supp{grid-template-columns:minmax(0,1fr) 92px 38px}.supp .sdose{grid-column:1/2;grid-row:2}}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:12px;padding:9px 12px;text-align:left;width:100%}
.check .bx{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;flex:none;color:transparent}
.check .bx svg{width:15px;height:15px}
.check[aria-pressed="true"] .bx{background:var(--lime);border-color:var(--lime);color:var(--on-accent)}
.check[aria-pressed="true"] .ct{text-decoration:line-through;color:var(--muted)}
.check .ct{font-weight:600;font-size:14px}
.check .cs{font-size:12px;color:var(--muted);margin-left:auto;font-family:var(--f-mono)}

/* ---------- dieta ---------- */
.daynav{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:4px}
.daynav .dl{font-weight:700;min-width:150px;text-align:center;font-size:14px}
.meal{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--glass-b);border-radius:var(--r);overflow:hidden}
.meal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.meal-h .mi{width:36px;height:36px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.meal-h .mi svg{width:20px;height:20px}
.meal-h h3{font-size:16px;font-weight:700;font-family:var(--f-display);letter-spacing:-.01em}
.meal-h .mm{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.meal-h .mk{font-family:var(--f-display);font-weight:800;font-size:20px;margin-left:auto;white-space:nowrap}
.meal-h .mk small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto 40px 30px 30px;gap:8px;align-items:center;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .in{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.item .im{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-mono)}
.item .im span{display:inline-flex;align-items:center;gap:4px}
.item .ik{font-family:var(--f-mono);font-weight:600;font-size:14px;text-align:right}
.item .iconbtn{width:30px;height:30px}
.meal-f{padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:16px;color:var(--muted);font-size:14px;text-align:center}
.g-diet{grid-template-columns:minmax(0,7fr) minmax(0,4fr);grid-template-areas:"meals sum" "meals extra";grid-template-rows:auto 1fr;align-items:start}
.d-meals{grid-area:meals}.d-sum{grid-area:sum}.d-extra{grid-area:extra}
@media (max-width:899px){.g-diet{grid-template-columns:minmax(0,1fr);grid-template-areas:"sum" "meals" "extra";grid-template-rows:none}}
.tip-list{display:flex;flex-direction:column;gap:6px}
.tip{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid var(--line);color:inherit}
.tip .num{font-size:13px;color:var(--muted);white-space:nowrap}
.food-list{display:flex;flex-direction:column;max-height:min(50vh,460px);overflow:auto;border:1px solid var(--line);border-radius:14px}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;color:inherit}
.food:last-child{border-bottom:0}
.food:hover{background:var(--glass)}
.food .fn{font-weight:600;font-size:14px;display:block}
.food .fp{font-size:12px;color:var(--muted);display:block}
.food .fm{display:flex;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.food .fk{font-family:var(--f-mono);font-weight:600;font-size:14px;text-align:right}
.food .fk small{display:block;font-size:11px;color:var(--faint);font-weight:400}
.qty-prev{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qty-prev > div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.qty-prev .v{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.qty-prev .l{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;margin-top:4px}
.ai-drop{border:1.5px dashed rgba(60,200,230,.45);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:rgba(60,200,230,.05)}
.ai-drop svg{width:34px;height:34px;color:var(--accent)}
.ai-prev{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.ai-row{display:grid;grid-template-columns:28px minmax(0,1fr) 84px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ai-row .input{padding:6px 8px;font-size:14px;text-align:right}
.swap-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;color:inherit}
.swap-row:hover{background:var(--glass)}
.swap-row .sg{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:right}
.swap-row .sd{font-size:12px;font-family:var(--f-mono);color:var(--muted)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(2,8,12,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease}
.sheet{background:linear-gradient(180deg,#12303D,#0C222D);border:1px solid var(--glass-b);border-radius:20px;width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:rise .2s cubic-bezier(.2,.8,.2,1)}
.sheet.wide{width:min(860px,100%)}
.sheet-h{display:flex;align-items:flex-start;gap:10px}
.sheet-h h2{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.1;letter-spacing:-.02em}
.sheet-h .iconbtn{margin-left:auto}
@media (max-width:640px){
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:.6}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#E9FBFF;color:#05303C;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:200;box-shadow:var(--shadow);animation:rise .2s;max-width:calc(100% - 32px)}
@media (max-width:899px){.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.qa-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa{border:1px solid var(--line);background:rgba(0,0,0,.22);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;font-weight:600;color:inherit}
.qa:hover{border-color:var(--accent)}
.qa span{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.qa span svg{width:24px;height:24px}

/* ---------- gráficos ---------- */
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .ax{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dot2{width:8px;height:8px;border-radius:50%}
.tt{position:absolute;pointer-events:none;background:#E9FBFF;color:#05303C;font-size:12px;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-118%);box-shadow:var(--shadow);z-index:3}
.tt b{font-family:var(--f-mono)}
.chart-empty{border:1.5px dashed var(--line);border-radius:14px;padding:30px 16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.chart-empty svg{width:28px;height:28px;color:var(--faint)}

/* ---------- evolução ---------- */
.delta{font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.mgroup{display:flex;flex-direction:column;gap:10px}
.mgroup-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-top:4px}
.mgroup-h .pill{font-size:11px}
.mfield{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.mfield .mn{font-weight:600;font-size:14px}
.mfield .mh{font-size:12px;color:var(--muted)}
.mfield .input{padding:8px 10px;font-size:15px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ph-card{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:rgba(0,0,0,.3);aspect-ratio:3/4;padding:0;color:inherit}
.ph-card img{width:100%;height:100%;object-fit:cover;display:block}
.ph-card .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);font-size:12px;font-weight:700;text-align:left}
.ph-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ph-card .sel{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px}
.cmp{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:3/4}
.cmp img{width:100%;height:100%;object-fit:cover}
.cmp .cap{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);padding:3px 8px;border-radius:8px;font-size:12px;font-weight:700}
.cmp.grid-on::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(60,200,230,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(60,200,230,.45) 1px,transparent 1px);background-size:25% 12.5%;pointer-events:none}

/* ---------- treino ---------- */
.bodymap{display:flex;gap:6px;justify-content:center}
.bodymap figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;max-width:190px}
.bodymap figcaption{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.bodymap svg{width:100%;height:auto}
.bodymap .m{fill:var(--muscle);stroke:var(--bg);stroke-width:1.5;cursor:pointer;transition:fill .15s}
.bodymap .m:hover{fill:#3A6A80}
.bodymap .m.on{fill:var(--muscle-hi);filter:drop-shadow(0 0 6px rgba(60,200,230,.6))}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grp{border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:11px;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;font-size:14px}
.grp[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.grp span{font-family:var(--f-mono);font-size:12px;opacity:.7}
.exlist{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.ex{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.2);text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;color:inherit}
.ex:hover{border-color:var(--accent)}
.exi{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.exi svg{width:26px;height:26px}
.ex .exn{font-weight:700;font-size:15px;display:block}
.ex .exm{font-size:12px;color:var(--muted);margin-top:2px;display:block}
.ex .exr{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.detail h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.detail h4 svg{width:16px;height:16px;color:var(--accent)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:14px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:8px;background:var(--flame);color:var(--on-accent);font-family:var(--f-mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.blist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.blist li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14px}
.blist li svg{width:16px;height:16px;margin-top:3px}
.blist.err svg{color:var(--bad)} .blist.cue svg{color:var(--good)}
.rx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rx > div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rx .v{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1}
.rx .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.wex{border:1px solid var(--glass-b);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));overflow:hidden}
.wex-h{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-bottom:1px solid var(--line)}
.wex-h .n{font-weight:700}
.wex-h .p{font-size:12px;color:var(--muted)}
.sets{display:flex;flex-direction:column}
.set,.set-h{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 62px 38px 26px;gap:6px;align-items:center;padding:6px 12px}
.set-h{padding-top:8px;padding-bottom:0;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;text-align:center}
.set .sn{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:center}
.set .input{padding:7px 4px;font-size:15px;text-align:center}
.set select.input{padding:7px 2px;font-size:14px;text-align-last:center}
.set .ck{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:transparent}
.set .ck svg{width:18px;height:18px}
.set.done{background:rgba(61,220,151,.07)}
.set.done .ck{background:var(--lime);border-color:var(--lime);color:var(--on-accent)}
.set .iconbtn{width:26px;height:26px}
.timer{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;background:#E9FBFF;color:#05303C;border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.timer .tv{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;min-width:64px}
.timer .iconbtn{color:#05303C}
.timer .iconbtn:hover{background:rgba(0,0,0,.08);color:#05303C}
@media (max-width:899px){.timer{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.hist{display:flex;flex-direction:column;gap:10px}
.hcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.2);display:flex;flex-direction:column;gap:6px}
.hcard .hh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hcard .hd{font-size:13px;color:var(--muted)}
.hcard .hx{font-size:13px;color:var(--muted)}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tpl > div,.tpl > button{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.2);text-align:left;display:flex;flex-direction:column;gap:4px;color:inherit}
.tpl > button:hover{border-color:var(--accent)}
.tpl .tn{font-weight:700}
.tpl .td{font-size:12px;color:var(--muted)}
.agenda{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:640px){.agenda{grid-template-columns:repeat(2,minmax(0,1fr))}}
.agenda .field label{font-size:11px}
.agenda select{font-size:13px;padding:8px 6px}
.wk{display:flex;flex-direction:column;gap:10px}
.wkrow{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.wkbar{height:12px;border-radius:99px;background:rgba(0,0,0,.3);border:1px solid var(--line);position:relative;overflow:hidden}
.wkbar .zone{position:absolute;top:0;bottom:0;background:rgba(61,220,151,.18)}
.wkbar .fill{position:absolute;top:2px;bottom:2px;left:2px;border-radius:99px;background:var(--accent)}
.reminder{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));z-index:150;background:linear-gradient(180deg,#14394A,#0E2734);border:1px solid rgba(60,200,230,.4);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5);padding:14px;display:flex;gap:12px;align-items:flex-start;animation:rise .25s}
.reminder .ri{width:42px;height:42px;border-radius:12px;background:var(--flame);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.reminder .ri svg{width:24px;height:24px}
.reminder .rt{font-weight:700}
.reminder .rd{font-size:13px;color:var(--muted)}
.water-big{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.glass{width:60px;height:84px;flex:none}
.wbtns{display:flex;gap:6px;flex-wrap:wrap}
.wl{display:flex;flex-direction:column;gap:6px;font-size:14px}
.wl div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.wl div:last-child{border-bottom:0;font-weight:700}
details summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

{id:"supino-reto",g:"peito",n:"Supino reto com barra",eq:"barra",prim:"Peitoral maior (porção esternal)",sec:"Deltoide anterior, tríceps",lvl:"Intermediário",rx:["3–4","6–10","2–3 min"],
how:["Deite no banco com olhos alinhados à barra. Pés firmes no chão, glúteos e escápulas apoiados.","Retraia e deprima as escápulas (\"peito estufado\") e crie um leve arco lombar natural.","Pegada um pouco mais larga que os ombros; punhos neutros, barra sobre a base da palma.","Desça a barra controlada (2–3 s) até tocar a linha dos mamilos/esterno inferior, cotovelos a 45–70° do tronco.","Empurre a barra para cima e levemente em direção aos ombros, sem perder a posição das escápulas."],
err:["Abrir os cotovelos a 90°, sobrecarregando a articulação do ombro.","Quicar a barra no peito para ganhar impulso.","Tirar os glúteos do banco ou soltar as escápulas no topo."],
cue:["\"Quebre a barra\" para ativar dorsais e estabilizar ombros.","Empurre o chão com as pernas (leg drive) sem levantar o quadril.","Pense em empurrar o corpo para longe da barra."]},
{id:"supino-inclinado-halter",g:"peito",n:"Supino inclinado com halteres",eq:"halter",prim:"Peitoral maior (porção clavicular)",sec:"Deltoide anterior, tríceps",lvl:"Iniciante",rx:["3–4","8–12","90 s–2 min"],
how:["Ajuste o banco entre 30° e 45°. Inclinações maiores transferem o trabalho para o ombro.","Leve os halteres aos joelhos e use-os para subi-los até a linha do peito ao deitar.","Escápulas retraídas, halteres alinhados ao peito superior, antebraços na vertical.","Desça até sentir alongamento no peitoral, com os halteres ao lado do peito.","Suba aproximando os halteres em arco, sem batê-los no topo."],
err:["Banco inclinado demais (acima de 45°).","Descer pouco e perder a amplitude, que é a vantagem dos halteres.","Deixar os punhos dobrarem para trás."],
cue:["Mantenha o antebraço sempre vertical sob o halter.","Controle a fase excêntrica e faça uma breve pausa embaixo."]},
{id:"crucifixo-halter",g:"peito",n:"Crucifixo com halteres",eq:"halter",prim:"Peitoral maior",sec:"Deltoide anterior, bíceps (estabilização)",lvl:"Iniciante",rx:["3","10–15","60–90 s"],
how:["Deitado em banco reto, halteres acima do peito com palmas voltadas uma para a outra.","Cotovelos levemente flexionados e travados nesse ângulo durante todo o movimento.","Abra os braços em arco até sentir alongamento, mãos na altura do peito.","Volte \"abraçando uma árvore\", contraindo o peitoral."],
err:["Transformar em supino, dobrando e esticando os cotovelos.","Descer além do confortável e forçar o ombro com carga alta."],
cue:["Carga moderada: o objetivo é alongamento sob tensão, não força máxima.","Pense em aproximar os bíceps, não as mãos."]},
{id:"crossover",g:"peito",n:"Crossover na polia",eq:"polia",prim:"Peitoral maior",sec:"Deltoide anterior",lvl:"Iniciante",rx:["3","12–15","60 s"],
how:["Polias na altura dos ombros (ou altas para enfatizar a parte inferior do peito).","Dê um passo à frente, tronco levemente inclinado, cotovelos semiflexionados.","Traga as mãos à frente do corpo em arco até se cruzarem levemente.","Segure 1 s na contração e volte controlando até sentir o alongamento."],
err:["Usar o tronco para balançar a carga.","Puxar com os braços, flexionando os cotovelos."],
cue:["Ajuste a altura da polia para mudar a ênfase: alta → peito inferior, baixa → peito superior.","Excelente como finalizador com tensão constante."]},
{id:"flexao",g:"peito",n:"Flexão de braços",eq:"corpo",prim:"Peitoral maior",sec:"Tríceps, deltoide anterior, core",lvl:"Iniciante",rx:["3–4","Até 2 reps da falha","60–90 s"],
how:["Mãos um pouco mais largas que os ombros, corpo em prancha da cabeça aos calcanhares.","Contraia glúteos e abdômen para não deixar o quadril cair.","Desça até o peito quase tocar o chão com cotovelos a ~45°.","Empurre o chão até estender os braços, mantendo o alinhamento."],
err:["Quadril caído ou elevado.","Amplitude curta, sem descer de verdade."],
cue:["Fácil demais? Eleve os pés, use mochila com carga ou faça pausas embaixo.","Difícil demais? Apoie as mãos num banco."]},

{id:"barra-fixa",g:"costas",n:"Barra fixa (pronada)",eq:"corpo",prim:"Latíssimo do dorso",sec:"Bíceps, romboides, trapézio inferior",lvl:"Intermediário",rx:["3–4","5–10","2 min"],
how:["Pegada pronada um pouco mais larga que os ombros, braços totalmente estendidos.","Inicie deprimindo as escápulas (\"ombros longe das orelhas\").","Puxe levando os cotovelos para baixo e para trás até o queixo passar a barra.","Desça controlado até a extensão completa."],

how:["Ajuste o apoio de coxas para ficar firme no banco.","Pegada pronada um pouco mais larga que os ombros.","Incline o tronco levemente para trás (~15°) e estufe o peito.","Puxe a barra até a parte alta do peito, conduzindo pelos cotovelos.","Retorne até os braços estenderem e as escápulas subirem."],
err:["Puxar atrás da nuca.","Jogar o tronco para trás a cada repetição.","Puxar só com os braços e o bíceps."],
cue:["Mãos são ganchos: o movimento sai dos cotovelos.","Sinta o alongamento do dorsal no topo."]},
{id:"remada-curvada",g:"costas",n:"Remada curvada com barra",eq:"barra",prim:"Latíssimo do dorso, romboides, trapézio médio",sec:"Deltoide posterior, bíceps, eretores da espinha",lvl:"Intermediário",rx:["3–4","6–10","2 min"],
how:["Em pé, pés na largura do quadril, segure a barra com pegada pronada ou supinada.","Flexione o quadril até o tronco ficar entre 30° e 45° do chão, joelhos levemente flexionados, coluna neutra.","Puxe a barra até a linha do umbigo, levando os cotovelos para trás.","Aperte as escápulas por 1 s e desça controlando."],
err:["Arredondar a lombar.","Levantar o tronco a cada repetição para roubar.","Puxar a barra para o peito, o que vira trabalho de trapézio superior."],
cue:["Abdômen travado como se fosse levar um soco.","Se a lombar cansar antes das costas, troque pela remada apoiada (cavalinho ou banco)."]},
{id:"remada-baixa",g:"costas",n:"Remada baixa sentada",eq:"polia",prim:"Romboides, trapézio médio, latíssimo",sec:"Bíceps, deltoide posterior",lvl:"Iniciante",rx:["3–4","10–12","90 s"],
how:["Sente com os pés apoiados e joelhos levemente flexionados, tronco ereto.","Segure o triângulo com braços estendidos e deixe as escápulas se afastarem.","Puxe até o abdômen, cotovelos rentes ao corpo, peito aberto.","Volte estendendo os braços até sentir alongamento nas costas."],
err:["Balançar o tronco para frente e para trás.","Encolher os ombros durante a puxada."],
cue:["Comece o movimento juntando as escápulas, depois puxe com os braços.","Mantenha o peito alto o tempo todo."]},
{id:"remada-unilateral",g:"costas",n:"Remada unilateral (serrote)",eq:"halter",prim:"Latíssimo do dorso",sec:"Romboides, deltoide posterior, bíceps",lvl:"Iniciante",rx:["3","8–12 por lado","60–90 s"],
how:["Apoie joelho e mão do mesmo lado em um banco, tronco paralelo ao chão.","Halter na mão livre, braço estendido, ombro alongado em direção ao chão.","Puxe o halter em direção ao quadril num arco, cotovelo rente ao corpo.","Desça devagar até o alongamento completo."],
err:["Girar o tronco para levantar mais carga.","Puxar para o peito em vez do quadril."],
cue:["Pense em colocar o halter no bolso de trás.","Ótimo para corrigir assimetrias entre lados."]},
{id:"encolhimento",g:"costas",n:"Encolhimento com halteres",eq:"halter",prim:"Trapézio superior",sec:"Levantador da escápula",lvl:"Iniciante",rx:["3","12–15","60 s"],
how:["Em pé, halteres ao lado do corpo, braços estendidos.","Eleve os ombros em direção às orelhas, sem dobrar os cotovelos.","Segure 1–2 s no topo e desça controlando."],
err:["Girar os ombros em círculos.","Usar carga alta com amplitude mínima."],
cue:["Movimento só para cima e para baixo.","A pausa no topo vale mais que a carga."]},
/* ---------------- OMBROS ---------------- */
{id:"desenv-halter",g:"ombros",n:"Desenvolvimento com halteres",eq:"halter",prim:"Deltoide anterior e lateral",sec:"Tríceps, trapézio superior",lvl:"Iniciante",rx:["3–4","8–12","90 s–2 min"],
how:["Sentado em banco a 80–90°, costas apoiadas, halteres na altura das orelhas.","Cotovelos levemente à frente do corpo (plano da escápula), antebraços verticais.","Empurre os halteres para cima até quase estender os cotovelos.","Desça controlando até a altura das orelhas."],
err:["Arquear demais a lombar para empurrar.","Descer pouco e não usar amplitude."],
cue:["Costelas para baixo, abdômen firme.","Halteres sobem levemente convergindo, sem bater."]},
{id:"desenv-barra",g:"ombros",n:"Desenvolvimento militar em pé",eq:"barra",prim:"Deltoide anterior",sec:"Deltoide lateral, tríceps, core",lvl:"Intermediário",rx:["3–4","5–8","2–3 min"],
how:["Barra apoiada na parte alta do peito, pegada um pouco mais larga que os ombros.","Glúteos e abdômen contraídos, pés na largura do quadril.","Empurre a barra em linha reta, afastando a cabeça para trás para deixá-la passar.","Quando a barra passar a testa, traga a cabeça para frente, \"por dentro da janela\".","Desça controlando até o peito."],
err:["Hiperestender a lombar, transformando em supino inclinado.","Empurrar a barra para frente em vez de para cima."],
cue:["Aperte os glúteos como se segurasse uma moeda.","No topo, a barra fica sobre o meio do pé."]},
{id:"elev-lateral",g:"ombros",n:"Elevação lateral",eq:"halter",prim:"Deltoide lateral",sec:"Trapézio superior, supraespinhal",lvl:"Iniciante",rx:["3–4","12–20","60 s"],
how:["Em pé, halteres ao lado do corpo, tronco levemente inclinado à frente.","Cotovelos levemente flexionados.","Eleve os braços lateralmente até a linha dos ombros, conduzindo pelos cotovelos.","Desça devagar (2–3 s), sem deixar o halter encostar no corpo."],
err:["Balançar o tronco para subir.","Subir acima dos ombros e encolher o trapézio.","Carga alta demais com execução ruim."],
cue:["Imagine empurrar as paredes laterais com os cotovelos.","Leve, controlado e com volume: o deltoide lateral responde bem a reps altas."]},
{id:"crucifixo-inverso",g:"ombros",n:"Crucifixo inverso",eq:"halter",prim:"Deltoide posterior",sec:"Romboides, trapézio médio",lvl:"Iniciante",rx:["3","12–15","60 s"],
how:["Tronco inclinado à frente quase paralelo ao chão (ou deitado em banco inclinado).","Halteres pendurados, palmas voltadas uma para a outra, cotovelos semiflexionados.","Abra os braços lateralmente até a linha do tronco.","Volte devagar."],
err:["Juntar as escápulas demais, virando exercício de costas.","Usar impulso do tronco."],
cue:["Pense em levar as mãos para longe, não para trás.","Polegares levemente para baixo aumentam a ênfase no deltoide posterior."]},
{id:"face-pull",g:"ombros",n:"Face pull",eq:"polia",prim:"Deltoide posterior, rotadores externos",sec:"Trapézio médio e inferior",lvl:"Iniciante",rx:["3","12–20","60 s"],
how:["Polia na altura do rosto com corda, pegada com polegares para trás.","Dê um passo atrás, braços estendidos à frente.","Puxe a corda em direção ao rosto, abrindo as mãos e levando os cotovelos para fora e para cima.","Termine em posição de \"duplo bíceps\", segure 1 s e volte."],
err:["Puxar para o pescoço com os cotovelos baixos.","Inclinar o tronco para trás."],
cue:["Excelente para saúde do ombro: inclua 2–3x por semana.","Separe a corda nas pontas ao final do movimento."]},
/* ---------------- BÍCEPS ---------------- */
{id:"rosca-direta",g:"biceps",n:"Rosca direta com barra",eq:"barra",prim:"Bíceps braquial",sec:"Braquial, braquiorradial",lvl:"Iniciante",rx:["3–4","8–12","60–90 s"],
how:["Em pé, pegada supinada na largura dos ombros, braços estendidos.","Cotovelos fixos ao lado do tronco.","Flexione os cotovelos trazendo a barra até a altura do peito.","Contraia 1 s e desça em 2–3 s até a extensão completa."],
err:["Jogar o tronco para trás (roubo).","Levar os cotovelos para frente no topo.","Não estender totalmente embaixo."],
cue:["Barra W alivia os punhos se houver desconforto.","Encoste as costas numa parede para eliminar o roubo."]},
{id:"rosca-alternada",g:"biceps",n:"Rosca alternada com halteres",eq:"halter",prim:"Bíceps braquial",sec:"Braquial, braquiorradial",lvl:"Iniciante",rx:["3","10–12 por braço","60 s"],
how:["Em pé ou sentado, halteres ao lado do corpo com palmas voltadas para dentro.","Suba um halter girando o punho (supinação) até a palma ficar para cima.","Contraia no topo e desça controlando enquanto o outro braço sobe ou espera."],
err:["Balançar o corpo.","Subir o cotovelo junto com o halter."],
cue:["Gire o dedo mínimo para cima no topo para máxima contração."]},
{id:"rosca-martelo",g:"biceps",n:"Rosca martelo",eq:"halter",prim:"Braquial, braquiorradial",sec:"Bíceps braquial",lvl:"Iniciante",rx:["3","10–12","60 s"],
how:["Halteres com pegada neutra (palmas para dentro), cotovelos colados ao tronco.","Flexione os cotovelos sem girar os punhos.","Suba até o antebraço ficar quase vertical e desça devagar."],
err:["Usar impulso das costas.","Abrir os cotovelos."],
cue:["Constrói espessura do braço e antebraço: o braquial empurra o bíceps para cima."]},
{id:"rosca-scott",g:"biceps",n:"Rosca Scott",eq:"maquina",prim:"Bíceps braquial (porção curta)",sec:"Braquial",lvl:"Iniciante",rx:["3","8–12","60–90 s"],
how:["Ajuste o banco para que as axilas encostem no topo do apoio.","Braços totalmente apoiados, pegada supinada.","Flexione até o antebraço ficar quase vertical.","Desça devagar até quase estender, sem travar o cotovelo com tranco."],
err:["Soltar o peso embaixo, gerando estresse no cotovelo.","Tirar os braços do apoio."],
cue:["A parte mais difícil é a de baixo: controle total ali."]},
{id:"rosca-inclinada",g:"biceps",n:"Rosca no banco inclinado",eq:"halter",prim:"Bíceps braquial (porção longa)",sec:"Braquial",lvl:"Intermediário",rx:["3","10–12","60–90 s"],
how:["Banco a 45–60°, costas apoiadas, braços pendurados atrás da linha do tronco.","Palmas para frente, cotovelos apontando para o chão.","Flexione sem levar os cotovelos para frente.","Desça até o alongamento completo do bíceps."],
err:["Tirar a cabeça e os ombros do banco.","Carga alta que impede a amplitude."],
cue:["Treinar o músculo alongado é um ótimo estímulo para hipertrofia."]},
/* ---------------- TRÍCEPS ---------------- */
{id:"triceps-corda",g:"triceps",n:"Tríceps na polia com corda",eq:"polia",prim:"Tríceps (cabeças lateral e medial)",sec:"Ancôneo",lvl:"Iniciante",rx:["3–4","10–15","60 s"],
how:["Polia alta com corda, cotovelos colados ao tronco, leve inclinação à frente.","Estenda os cotovelos empurrando a corda para baixo.","No final, afaste as pontas da corda para os lados.","Volte até ~90° de flexão sem mover os cotovelos."],
err:["Cotovelos indo para frente e para trás.","Usar o peso do corpo para empurrar."],
cue:["Os cotovelos são dobradiças fixas.","Abrir a corda embaixo aumenta a contração."]},
{id:"triceps-testa",g:"triceps",n:"Tríceps testa",eq:"barra",prim:"Tríceps (cabeça longa)",sec:"Cabeças lateral e medial",lvl:"Intermediário",rx:["3","8–12","90 s"],
how:["Deitado, barra W acima do peito com braços estendidos.","Incline levemente os braços para trás da vertical.","Flexione os cotovelos descendo a barra em direção à testa ou logo atrás da cabeça.","Estenda de volta sem abrir os cotovelos."],
err:["Abrir os cotovelos para os lados.","Mover os ombros, virando um supino."],
cue:["Descer atrás da cabeça alonga mais a cabeça longa.","Se o cotovelo incomodar, use halteres ou polia."]},
{id:"triceps-frances",g:"triceps",n:"Tríceps francês (overhead)",eq:"halter",prim:"Tríceps (cabeça longa)",sec:"Cabeças lateral e medial",lvl:"Iniciante",rx:["3","10–12","60–90 s"],
how:["Sentado, segure um halter com as duas mãos acima da cabeça.","Cotovelos apontando para frente/cima, próximos à cabeça.","Desça o halter atrás da cabeça até sentir alongamento.","Estenda os braços de volta."],
err:["Arquear a lombar.","Abrir muito os cotovelos."],
cue:["A posição acima da cabeça alonga a cabeça longa: ótimo para volume do braço."]},
{id:"mergulho",g:"triceps",n:"Mergulho nas paralelas",eq:"corpo",prim:"Tríceps",sec:"Peitoral inferior, deltoide anterior",lvl:"Intermediário",rx:["3","6–12","90 s–2 min"],
how:["Apoie-se nas paralelas com braços estendidos.","Tronco o mais vertical possível para focar no tríceps.","Desça até os cotovelos chegarem a ~90°.","Empurre de volta até estender."],
err:["Descer demais e forçar o ombro.","Encolher os ombros."],
cue:["Inclinar o tronco à frente transfere o foco para o peitoral.","Use a máquina com contrapeso se ainda não fizer o peso do corpo."]},
{id:"supino-fechado",g:"triceps",n:"Supino com pegada fechada",eq:"barra",prim:"Tríceps",sec:"Peitoral, deltoide anterior",lvl:"Intermediário",rx:["3–4","6–10","2 min"],
how:["Deitado, pegada na largura dos ombros (não mais fechada que isso).","Cotovelos próximos ao tronco durante a descida.","Desça até o esterno inferior.","Empurre estendendo totalmente os cotovelos."],
err:["Pegada estreita demais, que machuca os punhos.","Abrir os cotovelos."],
cue:["Permite carga alta para o tríceps: bom exercício principal do dia de braço."]},
/* ---------------- QUADRÍCEPS ---------------- */
{id:"agachamento",g:"quads",n:"Agachamento livre",eq:"barra",prim:"Quadríceps, glúteo máximo",sec:"Adutores, eretores da espinha, core",lvl:"Intermediário",rx:["3–5","5–10","2–3 min"],
how:["Barra apoiada no trapézio, mãos firmes, cotovelos para baixo.","Pés na largura dos ombros, pontas levemente para fora (15–30°).","Inspire, trave o abdômen (Valsalva) e inicie flexionando quadril e joelhos ao mesmo tempo.","Desça até a coxa ficar ao menos paralela ao chão, joelhos seguindo a direção dos pés.","Suba empurrando o chão com o pé inteiro, mantendo o peito alto."],
err:["Joelhos caindo para dentro (valgo).","Calcanhar saindo do chão.","Arredondar a lombar no fundo (\"butt wink\" acentuado).","Subir o quadril antes do tronco (\"good morning\")."],
cue:["Abra o chão com os pés, como se fosse rasgá-lo.","Peso no meio do pé.","Tornozelo travado? Use calço nos calcanhares ou tênis de levantamento."]},
{id:"leg-press",g:"quads",n:"Leg press 45°",eq:"maquina",prim:"Quadríceps",sec:"Glúteo, adutores",lvl:"Iniciante",rx:["3–4","8–15","2 min"],
how:["Costas e quadril totalmente apoiados no banco.","Pés na largura dos ombros, no meio da plataforma.","Destrave e desça controlando até os joelhos ficarem perto do peito, sem o quadril sair do banco.","Empurre sem travar totalmente os joelhos no topo."],
err:["Descer tanto que o quadril descola do banco (estresse lombar).","Travar os joelhos com tranco no topo.","Joelhos para dentro."],
cue:["Pés mais baixos na plataforma → mais quadríceps; mais altos → mais glúteo e posterior.","Encha a máquina com consciência: amplitude vale mais que anilha."]},
{id:"cadeira-extensora",g:"quads",n:"Cadeira extensora",eq:"maquina",prim:"Quadríceps (inclusive reto femoral)",sec:"—",lvl:"Iniciante",rx:["3","12–15","60–90 s"],
how:["Ajuste o encosto para que o joelho fique alinhado ao eixo da máquina.","Rolo apoiado logo acima do tornozelo.","Estenda os joelhos até quase travar, contraia 1 s.","Desça em 2–3 s."],
err:["Usar impulso e deixar o peso cair.","Tirar o quadril do banco."],
cue:["Segure as alças e puxe o quadril contra o banco.","Ótima para pré-exaustão ou finalização."]},
{id:"bulgaro",g:"quads",n:"Agachamento búlgaro",eq:"halter",prim:"Quadríceps, glúteo máximo",sec:"Adutores, estabilizadores do quadril",lvl:"Intermediário",rx:["3","8–12 por perna","90 s"],
how:["Pé de trás apoiado num banco, pé da frente a um passo largo de distância.","Halteres ao lado do corpo, tronco levemente inclinado à frente.","Desça o joelho de trás em direção ao chão até a coxa da frente ficar paralela.","Suba empurrando com o calcanhar e o meio do pé da frente."],
err:["Base estreita demais, gerando desequilíbrio.","Joelho da frente cair para dentro."],
cue:["Tronco mais inclinado → mais glúteo; mais vertical → mais quadríceps.","Comece pela perna mais fraca."]},
{id:"hack",g:"quads",n:"Agachamento hack",eq:"maquina",prim:"Quadríceps",sec:"Glúteo",lvl:"Iniciante",rx:["3–4","8–12","2 min"],
how:["Costas e ombros apoiados no encosto, pés na plataforma na largura dos ombros.","Destrave e desça até pelo menos 90° de joelho.","Mantenha a lombar colada no encosto.","Suba empurrando com o pé inteiro."],
err:["Descolar a lombar no fundo.","Calcanhares saindo da plataforma."],
cue:["Pés mais à frente aliviam os joelhos; mais atrás focam o quadríceps."]},
/* ---------------- POSTERIORES & GLÚTEOS ---------------- */
{id:"stiff",g:"post",n:"Stiff (levantamento romeno)",eq:"barra",prim:"Isquiotibiais, glúteo máximo",sec:"Eretores da espinha, adutor magno",lvl:"Intermediário",rx:["3–4","8–12","2 min"],
how:["Em pé, barra na frente das coxas, pés na largura do quadril, joelhos levemente flexionados.","Empurre o quadril para trás deslizando a barra rente às coxas.","Desça até sentir forte alongamento nos posteriores (geralmente abaixo do joelho).","Volte estendendo o quadril e contraindo os glúteos."],
err:["Arredondar a coluna para descer mais.","Flexionar demais os joelhos, virando um levantamento terra.","Afastar a barra do corpo."],
cue:["Pense em fechar uma porta com o quadril.","A amplitude é limitada pela flexibilidade, não pelo chão."]},
{id:"terra",g:"post",n:"Levantamento terra",eq:"barra",prim:"Glúteos, isquiotibiais, eretores da espinha",sec:"Quadríceps, trapézio, dorsais, antebraços",lvl:"Avançado",rx:["3","3–6","3 min"],
how:["Barra sobre o meio do pé, pés na largura do quadril.","Pegue a barra logo fora das pernas, canelas encostando na barra.","Peito alto, coluna neutra, dorsais ativos (\"esconda as axilas\").","Empurre o chão com as pernas e estenda o quadril, barra rente ao corpo.","Finalize em pé com glúteos contraídos, sem hiperestender a lombar. Desça pelo mesmo caminho."],
err:["Lombar arredondada.","Quadril subindo antes da barra.","Puxar com os braços dobrados."],
cue:["Tire a folga da barra antes de puxar.","Empurre o chão em vez de puxar a barra."]},
{id:"mesa-flexora",g:"post",n:"Mesa flexora",eq:"maquina",prim:"Isquiotibiais",sec:"Gastrocnêmio",lvl:"Iniciante",rx:["3","10–15","60–90 s"],
how:["Deitado de bruços, joelhos alinhados ao eixo da máquina, rolo acima do calcanhar.","Quadril pressionado contra o banco.","Flexione os joelhos trazendo o rolo em direção aos glúteos.","Desça devagar até quase estender."],
err:["Levantar o quadril do banco.","Movimento rápido e sem controle na descida."],
cue:["Pés em dorsiflexão (pontas para a canela) ajudam a recrutar mais posterior.","A cadeira flexora (sentado) alonga mais o posterior e é ótima alternativa."]},
{id:"hip-thrust",g:"post",n:"Elevação pélvica (hip thrust)",eq:"barra",prim:"Glúteo máximo",sec:"Isquiotibiais, quadríceps",lvl:"Iniciante",rx:["3–4","8–12","90 s–2 min"],
how:["Costas apoiadas no banco na altura das escápulas, barra (com protetor) sobre o quadril.","Pés na largura do quadril, canelas verticais no topo.","Eleve o quadril até o tronco ficar alinhado às coxas.","Contraia os glúteos 1–2 s no topo e desça controlando."],
err:["Hiperestender a lombar no topo.","Pés longe ou perto demais."],
cue:["Queixo para o peito e olhar à frente evita arquear a lombar.","Pense em retroverter a pelve no topo."]},
{id:"abdutora",g:"post",n:"Cadeira abdutora",eq:"maquina",prim:"Glúteo médio e mínimo",sec:"Tensor da fáscia lata",lvl:"Iniciante",rx:["3","15–20","60 s"],
how:["Sentado, costas apoiadas, lateral das coxas nos apoios.","Abra as pernas o máximo possível de forma controlada.","Segure 1 s e volte devagar sem deixar as placas baterem."],
err:["Usar impulso.","Amplitude curta com carga alta."],
cue:["Inclinar o tronco à frente aumenta a ênfase no glúteo máximo superior."]},
/* ---------------- PANTURRILHAS ---------------- */
{id:"pant-pe",g:"pant",n:"Panturrilha em pé",eq:"maquina",prim:"Gastrocnêmio",sec:"Sóleo",lvl:"Iniciante",rx:["4","8–15","60–90 s"],
how:["Ponta dos pés na plataforma, calcanhares livres, joelhos estendidos.","Desça o calcanhar até o alongamento máximo e segure 1–2 s.","Suba o mais alto possível na ponta dos pés e contraia 1 s."],
err:["Repetições quicadas e curtas.","Flexionar os joelhos para ajudar."],
cue:["A pausa no alongamento elimina o efeito mola do tendão.","Panturrilha responde a amplitude e controle, não a pressa."]},
{id:"pant-sentado",g:"pant",n:"Panturrilha sentado",eq:"maquina",prim:"Sóleo",sec:"Gastrocnêmio",lvl:"Iniciante",rx:["3–4","12–20","60 s"],
how:["Sentado com joelhos a 90° sob o apoio, ponta dos pés na plataforma.","Desça os calcanhares até alongar e pause.","Suba ao máximo e contraia."],
err:["Amplitude curta.","Ritmo rápido demais."],
cue:["Com joelho flexionado o sóleo trabalha mais: complementa a panturrilha em pé."]},
{id:"pant-legpress",g:"pant",n:"Panturrilha no leg press",eq:"maquina",prim:"Gastrocnêmio",sec:"Sóleo",lvl:"Iniciante",rx:["3–4","10–15","60 s"],
how:["No leg press, apoie só a ponta dos pés na borda inferior da plataforma.","Joelhos estendidos (sem travar).","Empurre com a ponta dos pés e retorne alongando."],
err:["Deixar o pé escorregar da plataforma.","Destravar a máquina sem segurança."],
cue:["Mantenha as travas de segurança acessíveis."]},
/* ---------------- ABDÔMEN ---------------- */
{id:"prancha",g:"abd",n:"Prancha",eq:"corpo",prim:"Reto do abdômen, transverso",sec:"Oblíquos, glúteos",lvl:"Iniciante",rx:["3","30–60 s","60 s"],
how:["Apoie antebraços e pontas dos pés, cotovelos sob os ombros.","Corpo alinhado da cabeça aos calcanhares.","Contraia glúteos e abdômen, puxando as costelas em direção ao quadril.","Respire de forma controlada sem perder a posição."],
err:["Quadril alto ou caído.","Prender a respiração."],
cue:["Mais difícil: tente empurrar os cotovelos em direção aos pés sem movê-los.","Qualidade > tempo. 30 s perfeitos valem mais que 2 min tortos."]},
{id:"abdominal-supra",g:"abd",n:"Abdominal supra (crunch)",eq:"corpo",prim:"Reto do abdômen",sec:"Oblíquos",lvl:"Iniciante",rx:["3","15–20","45–60 s"],
how:["Deitado, joelhos flexionados, pés apoiados.","Mãos ao lado da cabeça sem puxar o pescoço.","Enrole a coluna tirando as escápulas do chão, aproximando costelas e pelve.","Desça devagar."],

const Store = {
  mem:{}, db:null, uid:null, t:{}, busy:{}, again:{},
  init(){ try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(LS)) { try { this.mem[k.slice(LS.length)] = JSON.parse(localStorage.getItem(k)); } catch(e){} } } } catch(e){} },

  keys(prefix){ return Object.keys(this.mem).filter(k => k.startsWith(prefix) && this.mem[k]); },

  async flush(k){
    if (this.busy[k]) { this.again[k] = true; return; }
    this.busy[k] = true;
    try { const ref = this.db.collection("data/users/" + this.uid).doc(k); const v = this.mem[k]; if (v == null) await ref.delete(); else await ref.set(v); setSync("ok"); }

      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.db = db; this.uid = id;
      const snap = await db.collection("data/users/" + id).limit(1000).get();
      const remote = {}; snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });
      let changed = false;
      for (const k in remote) { const r = remote[k], l = this.mem[k]; if (!l || (r._ts || 0) > (l._ts || 0)) { this.mem[k] = JSON.parse(JSON.stringify(r)); this.local(k, this.mem[k]); changed = true; } }

      for (const k of push) await this.flush(k);
      setSync("ok");
      if (changed) render();
    } catch(e){ console.warn(e); setSync("err"); }
  }

}

/* gráfico de linhas com uma ou mais séries (mesmo eixo) */
function lineChartM(series, o = {}){
  series = series.filter(s => s.pts && s.pts.length);
  if (!series.length) return `<div class="chart-empty">${ic("up")}<b>${esc(o.empty || "Nenhum registro ainda")}</b><span>${esc(o.emptySub || "")}</span></div>`;

  const ts = x => parseISO(x).getTime();
  let x0 = ts(allX[0]), x1 = ts(allX[allX.length - 1]); if (x0 === x1) { x0 -= 3 * 864e5; x1 += 3 * 864e5; }

  const step = niceStep((y1 - y0) / 4); y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const X = t => pl + (t - x0) / (x1 - x0) * (W - pl - pr);
  const Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);

    const lab = allX.length > 2 ? [0, Math.floor((allX.length - 1) / 2), allX.length - 1] : allX.map((_, i) => i);

    if (!s.noLine) marks += `<path d="${line}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.dots && !mini) marks += pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="${s.noLine ? 3.6 : 3}" fill="${s.noLine ? s.color : "var(--bg)"}" stroke="${s.noLine ? "var(--bg)" : s.color}" stroke-width="1.6"/>`).join("");
    if (!s.noEnd) { const l = pts[pts.length - 1]; marks += `<circle cx="${l[0]}" cy="${l[1]}" r="${mini ? 4 : 5.5}" fill="${s.color}" stroke="var(--bg)" stroke-width="2"/>`; }
  });
  const hov = allX.map(x => [X(ts(x)), x, series.map(s => { const p = s.pts.find(q => q.x === x); return p ? [Y(p.y), p.y] : null; })]);

}

function waterBlock(day, c){
  const tot = c.water.total, v = day.water || 0, pct = Math.min(v / tot, 1);
  const lvl = 78 - 66 * pct;
  return `<div class="water-big"><svg class="glass" viewBox="0 0 64 88" aria-hidden="true"><defs><clipPath id="gl"><path d="M8 6h48l-6 76H14z"/></clipPath></defs><path d="M8 6h48l-6 76H14z" fill="rgba(0,0,0,.3)"/><rect x="0" y="${lvl}" width="64" height="90" fill="#3CC8E6" opacity=".85" clip-path="url(#gl)"/><path d="M8 6h48l-6 76H14z" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/></svg>
  <div><div class="stat"><span class="lbl">Bebido hoje</span><div class="v">${fmt(v / 1000, 2)}<small>de ${fmt(tot / 1000, 1)} L</small></div><div class="d">${v >= tot ? "Meta batida. Boa!" : `Faltam ${fmt(tot - v)} ml · cerca de ${Math.ceil((tot - v) / 250)} copos`}</div></div>

}

function numField(k, label, v, unit, step, ph = ""){

}
function refreshPlano(){
  const p = P(), c = calc(p);
  const e = $("#energy-out"); if (!e) return;
  e.innerHTML = `<div class="energy"><div><div class="t">Taxa metabólica basal</div><div class="v num">${fmt(c.bmr)}</div><div class="t">kcal em repouso</div></div><div><div class="t">Gasto total (GET)</div><div class="v num">${fmt(c.tdee)}</div><div class="t">TMB × ${String(p.act).replace(".", ",")}</div></div><div class="hl"><div class="t">Meta diária</div><div class="v num">${fmt(c.kcal)}</div><div class="t">${c.delta > 0 ? "+500 kcal" : c.delta < 0 ? "−500 kcal" : "manutenção"}</div></div></div>
  ${c.lbm ? `<p class="sub" style="margin-top:8px">Massa magra estimada: <b class="num">${fmt(c.lbm, 1)} kg</b>. Com % de gordura informado, a Katch-McArdle tende a ser mais precisa para quem treina.</p>` : ""}`;
  $("#goals-out").innerHTML = Object.entries(GOALS).map(([k, g]) => `<button class="goal" data-act="setp" data-k="goal" data-v="${k}" aria-pressed="${p.goal === k}"><span class="gi">${ic(g.ic)}</span><span class="gt">${g.n}</span><span class="gk num">${fmt(c.tdee + g.delta)}<small> kcal</small></span><span class="gd">${g.d}</span></button>`).join("");
  $("#pkg-v").textContent = fmt(p.pkg, 1) + " g/kg"; $("#fkg-v").textContent = fmt(p.fkg, 2) + " g/kg";
  const kp = c.prot * 4, kc = c.carb * 4, kf = c.fat * 9, kt = kp + kc + kf || 1, w = +p.weight || 1, n = clamp(+p.meals || 5, 3, 6);
  const warn = [];
  if (p.goal === "cut" && c.kcal < c.bmr) warn.push(`A meta de lipólise ficou abaixo da sua TMB (${fmt(c.bmr)} kcal). Prefira aumentar o gasto com passos/cardio a cortar mais comida.`);
  if (c.carb < 80) warn.push("Sobrou pouco espaço para carboidratos. Reduza a gordura ou a proteína para manter energia no treino.");
  $("#macro-out").innerHTML = `
    <div class="stack" aria-hidden="true"><div style="flex-grow:${kp};background:var(--prot)">P ${Math.round(kp / kt * 100)}%</div><div style="flex-grow:${kc};background:var(--carb)">C ${Math.round(kc / kt * 100)}%</div><div style="flex-grow:${kf};background:var(--fat)">G ${Math.round(kf / kt * 100)}%</div></div>
    <div class="tscroll" style="margin-top:12px"><table class="mtable"><thead><tr><th>Macro</th><th>Gramas</th><th>g/kg</th><th>kcal</th><th>Por refeição</th></tr></thead><tbody>
      <tr><td><span class="row" style="gap:7px"><i class="dot c-p"></i>Proteína</span></td><td>${fmt(c.prot)} g</td><td>${fmt(c.prot / w, 1)}</td><td>${fmt(kp)}</td><td>~${fmt(c.prot / n)} g</td></tr>
      <tr><td><span class="row" style="gap:7px"><i class="dot c-c"></i>Carboidrato</span></td><td>${fmt(c.carb)} g</td><td>${fmt(c.carb / w, 1)}</td><td>${fmt(kc)}</td><td>~${fmt(c.carb / n)} g</td></tr>
      <tr><td><span class="row" style="gap:7px"><i class="dot c-f"></i>Gordura</span></td><td>${fmt(c.fat)} g</td><td>${fmt(c.fat / w, 1)}</td><td>${fmt(kf)}</td><td>~${fmt(c.fat / n)} g</td></tr>
    </tbody></table></div>
    ${warn.map(x => `<div class="note warn" style="margin-top:10px">${ic("alert")}<span>${x}</span></div>`).join("")}
    <div class="note" style="margin-top:10px">${ic("info")}<span><b>Como ajustar:</b> pese-se 3 a 4 vezes por semana e compare as médias. ${p.goal === "bulk" ? "No bulking, mire em +0,25 a 0,5% do peso por semana. Se não subir em 2 semanas, some 100–150 kcal." : p.goal === "cut" ? "Na lipólise, mire em −0,5 a 1% do peso por semana. Se travar por 2 semanas, tire 100–150 kcal ou aumente os passos." : "Na manutenção, o peso deve oscilar dentro de ±0,5 kg na média semanal."}</span></div>`;
  const wc = c.water;
  $("#water-out").innerHTML = `<div class="stat"><span class="lbl">Meta diária de água</span><div class="v">${fmt(wc.total / 1000, 2)}<small>litros</small></div><div class="d">≈ ${Math.round(wc.total / 250)} copos de 250 ml</div></div>
    <div class="wl" style="margin-top:12px"><div><span>Base: ${wc.mlkg} ml × ${fmt(p.weight, 1)} kg</span><span class="num">${fmt(wc.base)} ml</span></div><div><span>Treino: 500 ml por hora</span><span class="num">+${fmt(wc.train)} ml</span></div><div><span>Clima quente</span><span class="num">+${fmt(wc.hot)} ml</span></div><div><span>Total</span><span class="num">${fmt(wc.total)} ml</span></div></div>
    <p class="sub" style="margin-top:10px">${wc.mlkg} ml/kg é a referência para a sua faixa de idade. Urina amarelo-clara é um bom sinal de hidratação.</p>`;
  refreshRotina();
}
function gcal(title, hm, details){
  const d = todayISO().replace(/-/g, ""), st = hm.replace(":", "");
  let endM = toMin(hm) + 15; if (endM >= 1440) endM = 1439;
  const en = toHM(endM).replace(":", "");

}

<script>
/* ======================= NÍVEIS & CONQUISTAS ======================= */
const LEVELS = [{n:"Frango", min:0, ic:"chick"}, {n:"Em Evolução", min:250, ic:"up"}, {n:"Atleta", min:900, ic:"bolt"}, {n:"Avançado", min:2200, ic:"crown"}];
function dayFlags(d, c){
  const day = Store.get(dayKey(d)); if (!day || !day.meals) return {logged:false};
  const t = dayTotals(day), logged = day.meals.some(m => m.items.length);
  return {logged, kcalOk: logged && Math.abs(t.k - c.kcal) <= c.kcal * 0.1, protOk: logged && t.p >= c.prot * 0.9, waterOk: (day.water || 0) >= c.water.total, t, water: day.water || 0, supps: day.supps || {}};
}
function streakDays(){
  const sess = new Set(allSessions().map(s => s.date)), c = calc(P());
  let d = todayISO(), n = 0;
  const active = x => sess.has(x) || dayFlags(x, c).logged;
  if (!active(d)) d = addDays(d, -1);
  while (active(d) && n < 999) { n++; d = addDays(d, -1); }
  return n;
}
function computeXP(){
  const c = calc(P()); let xp = 0;
  Store.keys("day-").forEach(k => { const f = dayFlags(k.slice(4), c); if (f.logged) xp += 5; if (f.kcalOk) xp += 10; if (f.protOk) xp += 10; if (f.waterOk) xp += 5; });
  xp += allSessions().length * 25 + measures().length * 15 + Store.keys("photo-").length * 10;
  return xp;
}
function levelInfo(){
  const xp = computeXP(); let i = 0; LEVELS.forEach((l, j) => { if (xp >= l.min) i = j; });
  const cur = LEVELS[i], next = LEVELS[i + 1];
  return {xp, i, cur, next, pct: next ? (xp - cur.min) / (next.min - cur.min) : 1, streak: streakDays()};
}
function hasPR(){
  const by = {};
  [...allSessions()].reverse().forEach(s => s.ex.forEach(e => { const b = Math.max(0, ...e.sets.map(st => e1rm(+st.kg || 0, +st.r || 0))); (by[e.id] = by[e.id] || []).push(b); }));
  return Object.values(by).some(a => a.length > 1 && Math.max(...a.slice(1)) > a[0] && a[0] > 0);
}

/* ======================= RELATÓRIO SEMANAL ======================= */
function weeklyStats(){
  const p = P(), c = calc(p), today = todayISO(), from = addDays(today, -6);
  const days = Array.from({length:7}, (_, i) => addDays(from, i)).map(d => ({d, f:dayFlags(d, c)}));
  const logged = days.filter(x => x.f.logged);
  const avg = k => logged.length ? logged.reduce((a, x) => a + x.f.t[k], 0) / logged.length : 0;
  const sess = allSessions().filter(s => s.date >= from), ws = weekSets();
  const low = GROUPS.filter(g => ws[g.id] < 10).map(g => g.n);
  const ms = measures().filter(m => +m.weight), lastW = ms[ms.length - 1], prevW = [...ms].reverse().find(m => m.date <= addDays(today, -7));
  const rpes = sess.flatMap(s => s.ex.flatMap(e => e.sets.map(st => +st.rpe).filter(Boolean)));
  return {goal:(GOALS[p.goal] || GOALS.bulk).n, metaKcal:c.kcal, metaProt:c.prot, metaCarb:c.carb, metaFat:c.fat, metaAgua:c.water.total,
    diasComDieta:logged.length, mediaKcal:Math.round(avg("k")), mediaProt:Math.round(avg("p")), mediaCarb:Math.round(avg("c")), mediaGord:Math.round(avg("f")),
    diasProteinaBatida:days.filter(x => x.f.protOk).length, diasAguaBatida:days.filter(x => x.f.waterOk).length,
    treinos:sess.length, series:sess.reduce((a, s) => a + sessSets(s), 0), seriesPorGrupo:Object.fromEntries(GROUPS.map(g => [g.n, ws[g.id]])), gruposAbaixoDe10Series:low,
    rpeMedio: rpes.length ? +(rpes.reduce((a, b) => a + b, 0) / rpes.length).toFixed(1) : null,
    pesoAtual: lastW ? lastW.weight : null, variacaoPesoSemana: lastW && prevW ? +(lastW.weight - prevW.weight).toFixed(2) : null};
}
function weeklyDiag(){
