/* ======================= CRONÔMETRO & AVISOS ======================= */
let AC = null;
function initAudio(){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch(e){} }
function beep(times = 2){
  try { if (!AC) return; let t = AC.currentTime; for (let i = 0; i < times; i++) { const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = i % 2 ? 1046 : 880; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.25); t += 0.3; } } catch(e){}
  try { navigator.vibrate && navigator.vibrate([180, 80, 180]); } catch(e){}
}
const TIMER = {end:0, iv:null};
function startTimer(sec){ TIMER.end = Date.now() + sec * 1000; clearInterval(TIMER.iv); TIMER.iv = setInterval(drawTimer, 250); drawTimer(); }
function stopTimer(){ clearInterval(TIMER.iv); TIMER.end = 0; $("#timerRoot").innerHTML = ""; }
function drawTimer(){
  const left = Math.max(0, Math.ceil((TIMER.end - Date.now()) / 1000));
  if (!left) { stopTimer(); beep(3); toast("Descanso concluído. Próxima série!"); return; }
  $("#timerRoot").innerHTML = `<div class="timer" role="timer">${ic("timer", 'style="width:22px;height:22px"')}<span class="tv num">${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}</span><button class="iconbtn" data-act="timerAdd" aria-label="Mais 15 segundos">${ic("plus")}</button><button class="iconbtn" data-act="timerStop" aria-label="Parar cronômetro">${ic("x")}</button></div>`;
}
function todaysEvents(p){
  const ev = [];
  if (p.remMeals) mealPlan(p).forEach(m => ev.push({t:m.time, kind:"meal", label:m.name}));
  if (p.remWater) waterPlan(p).forEach(w => ev.push({t:w.time, kind:"water", label:`beber ${w.ml} ml de água`, ml:w.ml}));
  if (p.remSupps) (p.supps || []).filter(s => s.time && s.n).forEach(s => ev.push({t:s.time, kind:"supp", label:`${s.n} (${s.dose})`, sid:s.id}));
  return ev.sort((a, b) => a.t.localeCompare(b.t));
}
const FIRED = new Set();
function checkReminders(){
  const p = P(); if (!p.remMeals && !p.remWater) return;
  const now = new Date(), hm = toHM(now.getHours() * 60 + now.getMinutes()), key = todayISO();
  todaysEvents(p).forEach(e => { if (e.t === hm) { const id = key + e.t + e.kind; if (!FIRED.has(id)) { FIRED.add(id); fireReminder(e); } } });
}
function fireReminder(e){
  const water = e.kind === "water", supp = e.kind === "supp", title = water ? "Hora de beber água" : supp ? "Hora do suplemento: " + e.label : "Hora de comer: " + e.label;
  const body = water ? `Beba ${e.ml} ml agora para chegar na meta do dia.` : supp ? "Tome agora e marque no checklist do dia." : "Abra a dieta e registre a refeição para não perder os macros.";
  if (supp) { document.getElementById("remRoot").innerHTML = `<div class="reminder" role="alert"><span class="ri">${ic("pill")}</span><div style="flex:1;min-width:0"><div class="rt">${esc(title)}</div><div class="rd">${esc(body)}</div><div class="row" style="margin-top:10px"><button class="btn primary sm" data-act="suppDone" data-arg="${e.sid}" data-d="${todayISO()}" data-close="1">${ic("check")}Tomei</button><button class="btn sm ghost" data-act="remClose">Dispensar</button></div></div></div>`; beep(4); try { if ("Notification" in window && Notification.permission === "granted") new Notification(title, {body}); } catch(err){} return; }
  document.getElementById("remRoot").innerHTML = `<div class="reminder" role="alert"><span class="ri">${ic(water ? "drop" : mealIcon(e.label))}</span><div style="flex:1;min-width:0"><div class="rt">${esc(title)}</div><div class="rd">${esc(body)}</div><div class="row" style="margin-top:10px">${water ? `<button class="btn primary sm" data-act="remWater" data-arg="${e.ml}">${ic("plus")}Registrar ${e.ml} ml</button>` : `<button class="btn primary sm" data-act="remMeal">${ic("plate")}Abrir dieta</button>`}<button class="btn sm ghost" data-act="remClose">Dispensar</button></div></div></div>`;
  beep(4);
  try { if ("Notification" in window && Notification.permission === "granted") new Notification(title, {body}); } catch(err){}
}
function askNotify(){ try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {}); } catch(e){} }

const PhotoDB = {
  db:null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { try { const r = indexedDB.open("desfrangolizador", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("kv", mode), s = t.objectStore("kv"), out = fn(s); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); },
  put(k, v){ return this.tx("readwrite", s => s.put(v, k)).catch(() => {}); },
  del(k){ return this.tx("readwrite", s => s.delete(k)).catch(() => {}); },
  async all(){ const db = await this.open(); return new Promise((res, rej) => { const out = {}, r = db.transaction("kv").objectStore("kv").openCursor(); r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); }; r.onerror = () => rej(r.error); }); }
};

async function saveBlob(blob, filename, okMsg){

  if (dl) { try { await dl.save({filename, data:blob}); toast(okMsg); } catch (e) { if (e.code !== "declined") toast("Não foi possível salvar agora"); } return; }

}

<script>
/* ======================= CORRIDA E ATIVIDADES ======================= */
Object.assign(ICONS, {
  run:'<circle cx="14.5" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v5M6.5 12.5l3-3.5 4 1 2.5 3.5 3 .5M10.5 9l-1.5 5"/>',

  bike:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l3 7h-7M13 6h3"/>',

  swim:'<path d="M2 18c2 0 2-1.5 4-1.5S8 18 10 18s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><circle cx="16" cy="7" r="2"/><path d="M6 14l4-5 3 2 3-1"/>',
  bolt2:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  glove:'<path d="M7 11V7a3 3 0 0 1 3-3h4a4 4 0 0 1 4 4v5a6 6 0 0 1-6 6h-1a4 4 0 0 1-4-4v-1M7 11h5M8 21h8"/>',
  music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  mountain:'<path d="M3 20l6-10 4 6 3-4 5 8z"/><path d="M9 10l2 3"/>',
  pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  pause:'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>'
});
const ACT_TYPES = [
  {id:"run", n:"Corrida", ic:"run", met:9.8, perKm:1.0, gps:true, maxV:8},
  {id:"walk", n:"Caminhada", ic:"walk", met:3.8, perKm:0.55, gps:true, maxV:4},
  {id:"bike", n:"Bike", ic:"bike", met:7.5, gps:true, maxV:25},
  {id:"trail", n:"Trilha", ic:"mountain", met:6.5, gps:true, maxV:5},
  {id:"soccer", n:"Futebol", ic:"ball", met:7.0},
  {id:"swim", n:"Natação", ic:"swim", met:6.0},
  {id:"hiit", n:"HIIT / funcional", ic:"bolt2", met:8.0},
  {id:"fight", n:"Luta", ic:"glove", met:9.0},
  {id:"dance", n:"Dança", ic:"music", met:5.0},
  {id:"other", n:"Outro esporte", ic:"flame", met:6.0}
];
const AT = id => ACT_TYPES.find(t => t.id === id) || ACT_TYPES[ACT_TYPES.length - 1];

/* Calorias: corrida e caminhada pela distância (kcal/kg/km), o resto pelo MET × peso × horas. */
function actKcal(type, min, km, kg){
  const t = AT(type);
  if (t.perKm && km > 0) return Math.round(t.perKm * kg * km);
  return Math.round(t.met * kg * (min || 0) / 60);
}
/* O que entra na meta do dia: desconta o que o corpo gastaria em repouso (1 MET) no mesmo tempo. */
const actNet = (a, kg) => Math.max(0, Math.round((a.kcal || 0) - kg * (a.min || 0) / 60));

const actsKey = d => "acts-" + d.slice(0, 7);
function allActs(){ return Store.keys("acts-").flatMap(k => (Store.get(k) || {}).list || []).sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || ""))); }
const actsOn = d => ((Store.get(actsKey(d)) || {}).list || []).filter(a => a.date === d);
function saveAct(a){ const k = actsKey(a.date), doc = Store.get(k) || {list:[]}; const list = (doc.list || []).filter(x => x.id !== a.id).concat([a]); Store.put(k, {list}); }
function delAct(id){ Store.keys("acts-").forEach(k => { const doc = Store.get(k); if (doc && (doc.list || []).some(a => a.id === id)) Store.put(k, {list:doc.list.filter(a => a.id !== id)}); }); }

/* Meta do dia com as atividades extras somadas (carbo 75 %, gordura 25 %) e 500 ml de água por hora. */
function calcDay(p, d){
  const c = calc(p); if (p.addActs === false) return c;
  const acts = actsOn(d); if (!acts.length) return c;
  const net = acts.reduce((s, a) => s + actNet(a, p.weight), 0), mins = acts.reduce((s, a) => s + (a.min || 0), 0);
  const ew = Math.round(mins / 60 * 500 / 50) * 50;
  if (!net && !ew) return c;
  return Object.assign({}, c, {kcal:c.kcal + net, carb:c.carb + Math.round(net * .75 / 4), fat:c.fat + Math.round(net * .25 / 9), water:Object.assign({}, c.water, {total:c.water.total + ew}), extra:{kcal:net, water:ew, n:acts.length}});
}

const durTxt = min => { min = Math.round(min || 0); const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h ${String(m).padStart(2, "0")}` : `${m} min`; };
const paceTxt = (sec, km) => { if (!km || km < 0.05) return "–"; const s = sec / km; if (!isFinite(s) || s > 3600) return "–"; return `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`; };
const clock = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(ss).padStart(2, "0"); };

function routeSVG(pts, cls = "", stroke = 3){
  if (!pts || pts.length < 2) return "";
  const lat0 = pts[0][0] * Math.PI / 180, xs = pts.map(p => p[1] * Math.cos(lat0)), ys = pts.map(p => -p[0]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const span = Math.max(maxX - minX, maxY - minY) || 1e-6, pad = span * 0.12, S = span + pad * 2;
  const ox = minX - pad - (span - (maxX - minX)) / 2, oy = minY - pad - (span - (maxY - minY)) / 2;
  const P = pts.map((p, i) => `${((xs[i] - ox) / S * 100).toFixed(2)},${((ys[i] - oy) / S * 100).toFixed(2)}`);
  const [sx, sy] = P[0].split(","), [ex, ey] = P[P.length - 1].split(",");
  return `<svg class="${cls}" ${cls ? "" : 'style="width:100%;height:100%;display:block"'} viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><polyline points="${P.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${sx}" cy="${sy}" r="3" fill="var(--lime)"/><circle cx="${ex}" cy="${ey}" r="3" fill="#fff" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}

/* ---------- Aba ---------- */
function runTab(){

}

function trimEnds(pts, m = 200){
  if (!pts || pts.length < 4) return pts;
  const cut = arr => { let d = 0, i = 1; for (; i < arr.length; i++) { d += hav(arr[i - 1], arr[i]); if (d >= m) break; } return i; };
  const a = cut(pts), b = pts.length - cut([...pts].reverse());

}

  x.fillStyle = "#EAF4F7"; x.font = "800 40px Montserrat, sans-serif"; x.fillText("Desfrangolizador", 192, 118);
  x.fillStyle = "#9DB3BC"; x.font = "500 30px Figtree, sans-serif"; x.fillText(`${a.name || AT(a.type).n} · ${dLabel(a.date)}${a.time ? " · " + a.time : ""}`, 192, 158);
  // trajeto
  const pts = a.hideEnds === false ? a.track : trimEnds(a.track);

    const lat0 = pts[0][0] * Math.PI / 180, xs = pts.map(p => p[1] * Math.cos(lat0)), ys = pts.map(p => -p[0]);
    const mnX = Math.min(...xs), mxX = Math.max(...xs), mnY = Math.min(...ys), mxY = Math.max(...ys);
    const sc = Math.min(box.w / ((mxX - mnX) || 1e-6), box.h / ((mxY - mnY) || 1e-6)) * .92;
    const ox = box.x + (box.w - (mxX - mnX) * sc) / 2, oy = box.y + (box.h - (mxY - mnY) * sc) / 2;
    const P = xs.map((v, i) => [ox + (v - mnX) * sc, oy + (ys[i] - mnY) * sc]);
    const grd = x.createLinearGradient(box.x, box.y, box.x + box.w, box.y + box.h); grd.addColorStop(0, "#3DDC97"); grd.addColorStop(1, "#3CC8E6");
    x.strokeStyle = grd; x.lineWidth = 14; x.lineCap = "round"; x.lineJoin = "round"; x.shadowColor = "rgba(60,200,230,.6)"; x.shadowBlur = 24;
    x.beginPath(); P.forEach(([px, py], i) => i ? x.lineTo(px, py) : x.moveTo(px, py)); x.stroke(); x.shadowBlur = 0;

  } else {
    x.fillStyle = "#3CC8E6"; x.font = "900 120px Montserrat, sans-serif"; x.textAlign = "center"; x.fillText(AT(a.type).n.toUpperCase(), W / 2, box.y + box.h / 2 + 40); x.textAlign = "left";

  if (a.km) stats.push(bike ? [fmt(a.km / (a.min / 60), 1), "km/h"] : [paceTxt(a.min * 60, a.km), "ritmo /km"]);

Object.assign(ACT, {

});

(() => {

.rules{font-size:13.5px;color:var(--muted);margin:0;padding-left:18px;line-height:1.6}
</style>
<script>
/* ======================= COMUNIDADE ======================= */
const SOC = {me:undefined, admin:false, tab:"descobrir", posts:[], liked:new Set(), loading:false, end:false, err:"", follows:new Set(), q:"", people:null, compose:null, stories:[], seen:new Set(), storyOff:false};
const socOn = () => typeof CLOUD !== "undefined" && CLOUD.sb && CLOUD.user;
const SB = () => CLOUD.sb;
const MEDIA_PREFIX = () => (window.DESFR_SUPA ? window.DESFR_SUPA.url : "") + "/storage/v1/object/public/media/";
const safeImg = u => typeof u === "string" && u.startsWith(MEDIA_PREFIX()) ? u : "";
Object.assign(ICONS, {eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'});
function ago(t){
  const s = (Date.now() - new Date(t).getTime()) / 1000;
  if (s < 60) return "agora"; if (s < 3600) return Math.floor(s / 60) + " min"; if (s < 86400) return Math.floor(s / 3600) + " h";
  if (s < 604800) return Math.floor(s / 86400) + " d"; const d = new Date(t); return dLabel(iso(d));
}
function avInner(p, cls = ""){
  const src = p && safeImg(p.avatar_url), init = ((p && (p.display_name || p.username)) || "?").slice(0, 1).toUpperCase();
  return `<span class="uavi ${cls}">${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : esc(init)}</span>`;
}
function uav(p, cls = ""){
  const src = p && safeImg(p.avatar_url), init = ((p && (p.display_name || p.username)) || "?").slice(0, 1).toUpperCase();
  return `<button class="uav ${cls}" data-act="socProfile" data-arg="${p ? p.id : ""}" aria-label="Ver perfil de ${esc(p ? p.display_name : "")}">${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : esc(init)}</button>`;
}
/* Avatar com o anel de story: toca para ver os stories da pessoa. */
function uavS(p, cls = ""){
  const g = p && storyGroup(p.id);
  if (!g) return uav(p, cls);
  return `<button class="st-ring ${g.unseen ? "new" : ""}" data-act="stUser" data-arg="${p.id}" aria-label="Ver stories de ${esc(p.display_name || "")}">${avInner(p, cls)}</button>`;
}
const socErr = e => { console.warn(e); const m = (e && e.message) || ""; toast(/fetch|network/i.test(m) ? "Sem conexão agora" : /duplicate|unique/i.test(m) ? "Esse @usuário já existe" : "Não deu certo, tente de novo"); };

/* ---------- Dados ---------- */
async function socLoadMe(){
  if (SOC.loading) return; SOC.loading = true;
  try {
    const uid = CLOUD.user.id;
    const [me, ad, fl] = await Promise.all([
      SB().from("profiles").select("*").eq("id", uid).maybeSingle(),
      SB().from("admins").select("user_id").eq("user_id", uid).maybeSingle(),
      SB().from("follows").select("followee").eq("follower", uid)
    ]);
    if (me.error) throw me.error;
    SOC.me = me.data || null; SOC.admin = !!(ad.data); SOC.follows = new Set(((fl.data) || []).map(x => x.followee));
    SOC.err = "";
  } catch (e) { SOC.err = "Sem conexão com a Comunidade agora."; SOC.me = undefined; }
  SOC.loading = false;
  if (SOC.me && SOC.openCompose && SOC.compose) { SOC.openCompose = false; setTimeout(composer, 0); }
  if (SOC.me) { socLoadFeed(true); stCleanup(); try { const sv = JSON.parse(sessionStorage.getItem(CMP_LS) || "null"); if (sv && !SOC.compose && (sv.body || sv.img)) { SOC.compose = {body:sv.body, att:sv.att, dest:sv.dest || "feed", bg:sv.bg || 0, imgData:sv.img, imgUrl:sv.img}; UI.tab = "social"; render(); composer(); toast("Seu post foi recuperado"); } } catch (e) {} }
  else if (UI.tab === "social") render();
}
const POST_SEL = "id,user_id,kind,body,data,image_url,created_at,profiles!posts_user_id_fkey(id,username,display_name,avatar_url),likes(count),comments(count)";
async function socLoadFeed(reset){
  if (SOC.loading) return; SOC.loading = true;
  if (reset) { SOC.posts = []; SOC.end = false; socLoadStories(); }
  if (UI.tab === "social") render();
  try {
    let q = SB().from("posts").select(POST_SEL).order("created_at", {ascending:false}).limit(15);
    if (SOC.tab === "seguindo") q = q.in("user_id", [CLOUD.user.id, ...SOC.follows]);
    const feed = SOC.posts.filter(p => !p._extra);
    if (feed.length) q = q.lt("created_at", feed[feed.length - 1].created_at);
    const r = await q; if (r.error) throw r.error;
    const got = r.data || []; SOC.posts = feed.concat(got); if (got.length < 15) SOC.end = true;
    if (got.length) { const lk = await SB().from("likes").select("post_id").eq("user_id", CLOUD.user.id).in("post_id", got.map(p => p.id)); (lk.data || []).forEach(x => SOC.liked.add(x.post_id)); }
    SOC.err = "";
  } catch (e) { SOC.err = "Não foi possível carregar o feed. Verifique a internet."; }
  SOC.loading = false;
  if (UI.tab === "social") render();
}
const cnt = (p, k) => (p[k] && p[k][0] && p[k][0].count) || 0;

/* ---------- Stories (somem em 24 h) ---------- */
const STORY_SEL = "id,user_id,kind,body,bg,data,image_url,created_at,expires_at,profiles!stories_user_id_fkey(id,username,display_name,avatar_url)";
const STBG = ["linear-gradient(160deg,#3DDC97,#3CC8E6)","linear-gradient(160deg,#feda75,#fa7e1e,#d62976)","linear-gradient(160deg,#962fbf,#4f5bd5)","linear-gradient(160deg,#15303D,#06131B)","linear-gradient(160deg,#ff6b6b,#ff9f43)","linear-gradient(160deg,#11998e,#38ef7d)","linear-gradient(160deg,#232526,#414345)","linear-gradient(160deg,#f857a6,#ff5858)"];
const storyGroup = id => SOC.stories.find(g => g.user.id === id);
async function socLoadStories(){
  try {
    const me = CLOUD.user.id;
    const r = await SB().from("stories").select(STORY_SEL).gt("expires_at", new Date().toISOString()).order("created_at").limit(200);
    if (r.error) throw r.error;
    const list = r.data || [], ids = list.filter(s => s.user_id !== me).map(s => s.id);
    if (ids.length) { const v = await SB().from("story_views").select("story_id").eq("viewer", me).in("story_id", ids); (v.data || []).forEach(x => SOC.seen.add(x.story_id)); }
    const by = new Map();
    list.forEach(s => { if (!s.profiles) return; if (!by.has(s.user_id)) by.set(s.user_id, {user:s.profiles, items:[]}); by.get(s.user_id).items.push(s); });
    const gs = [...by.values()];
    gs.forEach(g => { g.unseen = g.user.id !== me && g.items.some(s => !SOC.seen.has(s.id)); g.last = g.items[g.items.length - 1].created_at; });
    const rank = g => g.user.id === me ? 0 : (g.unseen ? 1 : 3) + (SOC.follows.has(g.user.id) ? 0 : 1);
    SOC.stories = gs.sort((a, b) => rank(a) - rank(b) || b.last.localeCompare(a.last));
    SOC.storyOff = false;
  } catch (e) { console.warn(e); SOC.stories = []; SOC.storyOff = true; }
  if (UI.tab === "social" && !ST.open) render();
}
/* Fotos de stories vencidos saem do armazenamento. */
async function stCleanup(){
  try {
    const me = CLOUD.user.id, r = await SB().storage.from("media").list(me, {search:"s-", limit:100});
    const old = (r.data || []).filter(f => f.name.startsWith("s-") && f.created_at && Date.now() - new Date(f.created_at).getTime() > 26 * 3600e3).map(f => me + "/" + f.name);
    if (old.length) await SB().storage.from("media").remove(old);
  } catch (e) {}
}
function storyBar(){
  if (SOC.storyOff) return "";
  const me = SOC.me, mine = storyGroup(me.id);
  const others = SOC.stories.filter(g => g.user.id !== me.id);
  return `<div class="stbar" role="list" aria-label="Stories">
    <div class="st-it" role="listitem"><span class="st-ring ${mine ? "" : "none"}" style="cursor:pointer" ${mine ? `data-act="stUser" data-arg="${me.id}"` : `data-act="stNew"`}>${avInner(me)}<button class="st-plus" data-act="stNew" aria-label="Novo story">${ic("plus")}</button></span><span>Seu story</span></div>
    ${others.map(g => `<button class="st-it" role="listitem" data-act="stUser" data-arg="${g.user.id}" aria-label="Story de ${esc(g.user.display_name)}${g.unseen ? ", novo" : ""}"><span class="st-ring ${g.unseen ? "new" : ""}">${avInner(g.user)}</span><span>${esc(g.user.username)}</span></button>`).join("")}
  </div>`;
}
const ST = {open:false, g:0, i:0, el:0, last:0, ready:false, paused:false, dur:6000, down:0};
function stRoot(){ let r = document.getElementById("storyRoot"); if (!r) { r = document.createElement("div"); r.id = "storyRoot"; document.body.appendChild(r); } return r; }
function stOpen(userId){
  const g = SOC.stories.findIndex(x => x.user.id === userId); if (g < 0) return;
  const items = SOC.stories[g].items, first = items.findIndex(s => !SOC.seen.has(s.id));
  ST.open = true; ST.g = g; ST.i = userId === CLOUD.user.id || first < 0 ? 0 : first; stShow();
  cancelAnimationFrame(ST.raf); ST.last = 0; ST.raf = requestAnimationFrame(stTick);
}
function stClose(){ ST.open = false; cancelAnimationFrame(ST.raf); stRoot().innerHTML = ""; SOC.stories.forEach(g => g.unseen = g.user.id !== CLOUD.user.id && g.items.some(s => !SOC.seen.has(s.id))); render(); }
function storyBody(s){
  const d = s.data, cap = s.body ? `<div class="${s.kind === "photo" ? "sv-cap" : "sv-text"}" ${s.kind === "day" ? 'style="font-size:20px"' : ""}>${esc(s.body)}</div>` : "";
  if (s.kind === "photo") { const img = safeImg(s.image_url); return `<div class="sv-body photo">${img ? `<img src="${esc(img)}" alt="Foto do story" onload="stReady()" onerror="stReady()">` : ""}${d && d.mk ? `<div class="sv-day">${dayCard(d, true)}</div>` : cap}${d && d.mk && s.body ? `<div class="sv-cap" style="bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))">${esc(s.body)}</div>` : ""}</div>`; }
  const bg = STBG[s.bg] || STBG[0];
  if (s.kind === "day" && d) return `<div class="sv-body" style="background:${bg}">${cap}<div style="width:100%">${dayCard(d, true)}</div></div>`;
  return `<div class="sv-body" style="background:${bg}">${cap}</div>`;
}
function stShow(){
  const g = SOC.stories[ST.g]; if (!g) return stClose();
  const s = g.items[ST.i]; if (!s) return stClose();
  const mine = g.user.id === CLOUD.user.id;
  ST.el = 0; ST.ready = s.kind !== "photo" || !safeImg(s.image_url); ST.dur = s.kind === "text" ? 5000 : 7000;
  stRoot().innerHTML = `<div class="sv" role="dialog" aria-modal="true" aria-label="Story de ${esc(g.user.display_name)}"><div class="sv-card">
    <div class="sv-bars">${g.items.map((x, k) => `<i><b style="width:${k < ST.i ? 100 : 0}%"></b></i>`).join("")}</div>
    <div class="sv-h">${avInner(g.user, "sm")}<button class="uname" data-act="stProfile" data-arg="${g.user.id}">${esc(g.user.username)}<small>${ago(s.created_at)}</small></button>
      <button class="iconbtn" data-act="stMenu" aria-label="Mais opções">${ic("dots")}</button><button class="iconbtn" data-act="stX" aria-label="Fechar">${ic("x")}</button></div>
    ${storyBody(s)}
    <button class="sv-nav prev" data-sv="-1" aria-label="Anterior"></button><button class="sv-nav next" data-sv="1" aria-label="Próximo"></button>
    ${mine ? `<div class="sv-foot"><button class="btn sm" data-act="stViews" data-arg="${s.id}">${ic("eye")}<span id="sv-vc">Visto por…</span></button></div>` : ""}
  </div></div>`;
  if (mine) SB().from("story_views").select("viewer", {count:"exact", head:true}).eq("story_id", s.id).then(r => { const el = $("#sv-vc"); if (el) el.textContent = "Visto por " + (r.count || 0); });
  else if (!SOC.seen.has(s.id)) { SOC.seen.add(s.id); SB().from("story_views").insert({story_id:s.id}).then(() => {}); }
}
function stReady(){ ST.ready = true; }
function stTick(ts){
  if (!ST.open) return;
  const dt = ST.last ? Math.min(ts - ST.last, 100) : 0; ST.last = ts;
  if (ST.ready && !ST.paused && !$("#modalRoot").innerHTML && !document.hidden) ST.el += dt;
  const bar = document.querySelectorAll(".sv-bars b")[ST.i]; if (bar) bar.style.width = Math.min(100, ST.el / ST.dur * 100) + "%";
  if (ST.el >= ST.dur) stStep(1);
  ST.raf = requestAnimationFrame(stTick);
}
function stStep(dir){
  const g = SOC.stories[ST.g];
  if (dir > 0) { if (g && ST.i < g.items.length - 1) ST.i++; else { ST.g++; ST.i = 0; if (ST.g >= SOC.stories.length) return stClose(); } }
  else { if (ST.i > 0) ST.i--; else if (ST.g > 0) { ST.g--; ST.i = 0; } else ST.el = 0; }
  stShow();
}
document.addEventListener("pointerdown", ev => { if (!ST.open || !ev.target.closest(".sv-nav")) return; ST.paused = true; ST.down = Date.now(); });
document.addEventListener("pointerup", ev => {
  if (!ST.open || !ST.paused) return; ST.paused = false;
  const nav = ev.target.closest(".sv-nav"); if (nav && Date.now() - ST.down < 300) stStep(+nav.dataset.sv);
});
document.addEventListener("pointercancel", () => { ST.paused = false; });
document.addEventListener("keydown", e => {
  if (!ST.open || $("#modalRoot").innerHTML) return;
  if (e.key === "Escape") stClose(); else if (e.key === "ArrowRight") stStep(1); else if (e.key === "ArrowLeft") stStep(-1);
});

/* ---------- Resumo do dia ---------- */
function daySum(d){
  const p = P(), c = typeof calcDay === "function" ? calcDay(p, d) : calc(p), day = getDay(d);
  if (!day.meals.some(m => m.items.length)) return null;
  const t = dayTotals(day), w = day.water || 0, near = (v, m, k) => Math.abs(v - m) <= m * k;
  const ok = [near(t.k, c.kcal, .1), t.p >= c.prot * .9, near(t.c, c.carb, .15), near(t.f, c.fat, .2), w >= c.water.total];
  const ss = allSessions().filter(s => s.date === d), acts = typeof allActs === "function" ? allActs().filter(a => a.date === d) : [];
  return {date:d, goal:(GOALS[p.goal] || GOALS.bulk).n, kcal:Math.round(t.k), mk:Math.round(c.kcal), p:Math.round(t.p), mp:Math.round(c.prot), c:Math.round(t.c), mc:Math.round(c.carb), f:Math.round(t.f), mf:Math.round(c.fat), w:Math.round(w), mw:Math.round(c.water.total), hits:ok.filter(Boolean).length,
    wk:ss.slice(0, 3).map(s => ({n:String(s.name || "Treino").slice(0, 40), s:sessSets(s)})), act:acts.length ? {n:acts.length, kcal:Math.round(acts.reduce((a, x) => a + (x.kcal || 0), 0))} : null};
}
/* Cartão do dia: números vêm de outras pessoas, então tudo passa por fmt/esc. */
function dayCard(d, big){
  const n = v => Math.max(0, +v || 0), pct = (v, m) => n(m) ? Math.min(100, n(v) / n(m) * 100) : 0;
  const R = 40, C = 2 * Math.PI * R, kp = pct(d.kcal, d.mk) / 100, over = n(d.mk) && n(d.kcal) > n(d.mk) * 1.1;
  const bar = (lbl, v, m, col, u = "g") => `<div class="dc-bar"><span>${lbl}</span><i><span style="width:${pct(v, m)}%;background:${col}"></span></i><em>${fmt(n(v))}/${fmt(n(m))}${u === "ml" ? "" : " " + u}</em></div>`;
  const dt = /^\d{4}-\d{2}-\d{2}$/.test(d.date || "") ? `${DOW[parseISO(d.date).getDay()]}, ${dShort(d.date)}` : "";
  return `<div class="daycard"${big ? ' style="gap:14px"' : ""}>
    <div class="dc-h">${ic("target", 'style="width:20px;height:20px;color:var(--accent)"')}<b>Resumo do dia</b><span class="sub">${esc(dt)}</span>${d.goal ? `<span class="pill">${esc(d.goal)}</span>` : ""}</div>
    <div class="dc-main"><div class="dc-ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/><circle cx="50" cy="50" r="${R}" fill="none" stroke="${over ? "var(--bad)" : "var(--accent)"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - kp)}"/></svg><div><b>${fmt(n(d.kcal))}</b><span>de ${fmt(n(d.mk))} kcal</span></div></div>
      <div class="dc-bars">${bar("Proteína", d.p, d.mp, "var(--prot)")}${bar("Carbo", d.c, d.mc, "var(--carb)")}${bar("Gordura", d.f, d.mf, "var(--fat)")}${bar("Água", d.w, d.mw, "#3CC8E6", "ml")}</div></div>
    <div class="dc-tags"><span>${ic("trophy")}${fmt(Math.min(5, n(d.hits)))}/5 metas</span>${(Array.isArray(d.wk) ? d.wk : []).slice(0, 3).map(w => `<span>${ic("dumbbell")}${esc(w.n)} · ${fmt(n(w.s))} séries</span>`).join("")}${d.act && n(d.act.n) ? `<span>${ic("run")}${fmt(n(d.act.n))} atividade${n(d.act.n) > 1 ? "s" : ""} · ${fmt(n(d.act.kcal))} kcal</span>` : ""}</div>
  </div>`;
}
function dayPostBtn(){
  if (typeof CLOUD === "undefined" || !CLOUD.sb) return "";
  return `<button class="btn sm ghost" data-act="dayPost">${ic("users")}Postar</button>`;
}

/* ---------- Tela ---------- */
function vSocial(){
  const head = `<div class="ph"><div><div class="eyebrow">Comunidade · treine junto</div><h1>Comunidade</h1><p class="lede">Poste suas corridas, treinos e conquistas, siga a galera e incentive quem está saindo do modo frango.</p></div></div>`;
  if (typeof CLOUD === "undefined" || !CLOUD.sb) return head + `<div class="note">${ic("info")}<span>A Comunidade funciona no site do app, com a sua conta: <a href="https://fernandocruzjr.github.io/Desfrangolizador/" target="_blank" rel="noopener"><b>abrir o Desfrangolizador</b></a>.</span></div>`;
  if (!CLOUD.user) return head + `<div class="note">${ic("info")}<span>Entre na sua conta para usar a Comunidade.</span></div>`;
  if (SOC.me === undefined) { if (!SOC.loading && !SOC.err) setTimeout(socLoadMe, 0); return head + (SOC.err ? `<div class="note warn">${ic("alert")}<span>${esc(SOC.err)}</span><button class="btn sm" data-act="socRetry">Tentar de novo</button></div>` : `<div class="empty">Carregando…</div>`); }
  if (SOC.me === null) return head + socOnboard();
  const posts = SOC.posts.filter(p => !p._extra);
  return `
    <div class="ig-top"><h1>Comunidade</h1>
      <button class="iconbtn" data-act="socNew" aria-label="Novo post">${ic("plus")}</button>
      <button class="iconbtn" data-act="socPeople" aria-label="Buscar pessoas">${ic("search")}</button>
      ${SOC.admin ? `<button class="iconbtn" data-act="socMod" aria-label="Moderação">${ic("shield")}</button>` : ""}
      <button class="iconbtn" data-act="socProfile" data-arg="${SOC.me.id}" aria-label="Meu perfil">${avInner(SOC.me, "sm")}</button>
    </div>
    ${storyBar()}
    <div class="ig-tabs">${[["descobrir","Para você"],["seguindo","Seguindo"]].map(([k, n]) => `<button data-act="socTab" data-arg="${k}" aria-pressed="${SOC.tab === k}">${n}</button>`).join("")}</div>
    <div class="feed" style="margin-top:12px">
      ${SOC.err ? `<div class="note warn">${ic("alert")}<span>${esc(SOC.err)}</span><button class="btn sm" data-act="socRefresh">Tentar de novo</button></div>` : ""}
      ${posts.map(postCard).join("")}
      ${!posts.length && !SOC.loading && !SOC.err ? `<div class="chart-empty">${ic("users")}<b>${SOC.tab === "seguindo" ? "Siga pessoas para ver os posts delas aqui" : "Seja o primeiro a postar!"}</b><span>${SOC.tab === "seguindo" ? "Use a lupa para encontrar a galera." : "Compartilhe uma corrida, um treino, o resumo do dia ou uma foto."}</span><button class="btn primary sm" data-act="${SOC.tab === "seguindo" ? "socPeople" : "socNew"}">${SOC.tab === "seguindo" ? "Buscar pessoas" : "Criar post"}</button></div>` : ""}
      ${SOC.loading ? `<div class="empty">Carregando…</div>` : posts.length && !SOC.end ? `<button class="btn" data-act="socMore">Carregar mais</button>` : ""}
      ${posts.length ? `<div class="row" style="justify-content:center"><button class="btn sm ghost" data-act="socRefresh">${ic("history")}Atualizar</button></div>` : ""}
    </div>`;
}
function postCard(p){

async function uploadImg(blob, name){

async function toJpeg(src, max, q = .82, square = false){
  let img;
  try { img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode")); i.src = typeof src === "string" ? src : URL.createObjectURL(src); }); }
  catch (e) { if (typeof src === "string" || !window.createImageBitmap) throw e; const bm = await createImageBitmap(src); img = {naturalWidth:bm.width, naturalHeight:bm.height, _bm:bm}; }
  const draw = img._bm || img;
  let w = img.naturalWidth, h = img.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
  if (square) { const s = Math.min(w, h); sx = (w - s) / 2; sy = (h - s) / 2; sw = sh = s; w = h = Math.min(max, s); }
  else { const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k); }
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(draw, sx, sy, sw, sh, 0, 0, w, h);
  return new Promise((r, j) => cv.toBlob(b => b ? r(b) : j(new Error("toBlob")), "image/jpeg", q));
}

  fAgenda: el => { const f = fichaById(el.dataset.arg); if (!f) return; const n = f.days.length, plan = {1:[[1,3,5],[1,3,5]],2:[[1,4],[2,5]],3:[[1,4],[2,5],[3,6]],4:[[1],[2],[4],[5]],5:[[1],[2],[3],[4],[5]],6:[[1],[2],[3],[4],[5],[6]]}[n] || []; const ag = {}; if (n === 1) [1,3,5].forEach(w => ag[w] = `f:${f.id}:0`); else plan.forEach((ws, i) => ws.forEach(w => ag[w] = `f:${f.id}:${i}`)); if (n === 2) { ag[1] = `f:${f.id}:0`; ag[2] = `f:${f.id}:1`; ag[4] = `f:${f.id}:0`; ag[5] = `f:${f.id}:1`; } setP({agenda:ag}); toast("Agenda montada. Ajuste os dias se quiser."); agendaModal(); },

  hRef: el => { const m = HMKX[el.dataset.arg], r = hRef(m.k) || [null, null], h = H();
    openModal(`${sheetHead("Faixa do seu laudo", esc(m.n))}<p class="sub">Cada laboratório tem a sua faixa. Copie a do laudo para os alertas ficarem certos para você.</p>
      <div class="fields"><div class="field"><label for="hr-lo">Mínimo</label><div class="input-u"><input id="hr-lo" class="input num" type="text" inputmode="decimal" value="${r[0] ?? ""}"><span>${esc(m.u)}</span></div></div><div class="field"><label for="hr-hi">Máximo</label><div class="input-u"><input id="hr-hi" class="input num" type="text" inputmode="decimal" value="${r[1] ?? ""}"><span>${esc(m.u)}</span></div></div></div>

    const h = H(); h.vitals = (h.vitals || []).concat({id:uid(), date:$("#hv-date").value || todayISO(), t:$("#hv-t").value, sys:Math.round(sys), dia:Math.round(dia), hr:hr > 20 && hr < 250 ? Math.round(hr) : null}); saveH(h); render();
    const c = paClass(sys, dia); toast(c.lv === "bad" ? `Pressão ${c.t}: veja o alerta no Painel` : "Medida salva");

  hSymSave: () => {

    h.syms = (h.syms || []).concat({id:uid(), date:$("#hs-date").value || todayISO(), s, note:$("#hs-note").value.trim()}); saveH(h); render();
    const urg = Object.keys(s).filter(k => (HSYM.find(x => x[0] === k) || [])[3]);

<script>
/* ======================= CONTA E NUVEM (SUPABASE) =======================
   Só na versão do site. Cada pessoa vê apenas os próprios dados (RLS na tabela user_docs). */
const CLOUD = {sb:null, user:null, busy:false};
(() => {
  const cfg = window.DESFR_SUPA;
  if (!cfg || !window.supabase || !window.supabase.createClient) return;
  try { CLOUD.sb = window.supabase.createClient(cfg.url, cfg.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}); } catch (e) { console.warn(e); }
  let stored = false; try { stored = Object.keys(localStorage).some(k => /^sb-.*-auth-token$/.test(k)); } catch (e) {}
  if (CLOUD.sb && !stored && !/access_token|type=recovery|code=/.test(location.hash + location.search)) CLOUD.gateEarly = true;
})();

/* Mesma interface que o Store já usa: collection(...).doc(k).set/delete e collection(...).limit(n).get(). */
function cloudDB(){
  const sb = CLOUD.sb, t = () => sb.from("user_docs");
  const chk = r => { if (r.error) throw r.error; return r; };
  return {
    collection(){ return {
      doc(k){ return {
        set: async v => chk(await t().upsert({user_id:CLOUD.user.id, key:k, data:v}, {onConflict:"user_id,key"})),
        delete: async () => chk(await t().delete().eq("key", k))
      }; },
      limit(n){ return { get: async () => { const r = chk(await t().select("key,data").limit(n)); return {docs:(r.data || []).map(x => ({id:x.key, exists:true, data:() => x.data}))}; } }; }
    }; }
  };
}

/* Offline: lembra quem entrou por último e o que foi apagado sem internet. */
const LAST_USER = "desfr-lastuser", PEND_DEL = "desfr-pending-del";
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const hasToken = () => { try { return Object.keys(localStorage).some(k => /^sb-.*-auth-token$/.test(k)); } catch (e) { return false; } };
{
  /* Apagou sem conexão? Guarda a chave para apagar na nuvem quando voltar. */
  const queue0 = Store.queue;
  Store.queue = function(k){
    if (this.mem[k] == null && CLOUD.sb) { const pd = lsGet(PEND_DEL, []); if (!pd.includes(k)) { pd.push(k); lsSet(PEND_DEL, pd); } }
    return queue0.call(this, k);
  };
}
Store.connectWith = async function(db, id){
  this.db = db; this.uid = id; setSync("saving");
  try {
    for (const k of lsGet(PEND_DEL, [])) { if (this.mem[k] == null) await db.collection("data/users/" + id).doc(k).delete(); }
    lsSet(PEND_DEL, null);
    const snap = await db.collection("data/users/" + id).limit(1000).get();
    const remote = {}; snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });
    let changed = false;
    for (const k in remote) { const r = remote[k], l = this.mem[k]; if (!l || (r._ts || 0) > (l._ts || 0)) { this.mem[k] = JSON.parse(JSON.stringify(r)); this.local(k, this.mem[k]); changed = true; } }
    const push = Object.keys(this.mem).filter(k => this.mem[k] && (!remote[k] || (this.mem[k]._ts || 0) > (remote[k]._ts || 0)));
    for (const k of push) await this.flush(k);
    setSync("ok");
    if (changed) render();
  } catch (e) { console.warn(e); setSync("err"); }
};

function goOffline(){
  const lu = lsGet(LAST_USER, null);
  if (!lu || !hasToken()) return false;
  CLOUD.offline = true; CLOUD.user = lu; Store.db = null;
  if (lu.name) VIEWER.name = lu.name;
  hideGate(); setSync("err"); render();
  return true;
}
async function cloudSession(session){
  const u = session && session.user;
  if (!u) {
    /* Sem internet o token não renova: segue com os dados do aparelho e sincroniza quando a conexão voltar. */
    if (hasToken() && goOffline()) return;
    CLOUD.user = null; CLOUD.offline = false; Store.db = null; setSync("local"); showGate(); return;
  }
  hideGate();
  if (CLOUD.user && CLOUD.user.id === u.id && !CLOUD.offline) return;
  CLOUD.offline = false;
  CLOUD.user = u;
  lsSet(LAST_USER, {id:u.id, email:u.email || "", name:(u.user_metadata && u.user_metadata.name) || "", user_metadata:u.user_metadata || {}});
  const nm = (u.user_metadata && u.user_metadata.name) || "";
  if (nm) VIEWER.name = nm;
  await Store.connectWith(cloudDB(), u.id);
  if (UI.tab === "inicio" || UI.tab === "social") render();
}
async function cloudResync(){
  if (!CLOUD.sb || !navigator.onLine) return;
  if (CLOUD.offline) {
    try { const r = await CLOUD.sb.auth.getSession(); if (r.data && r.data.session) await cloudSession(r.data.session); else if (!hasToken()) cloudSession(null); } catch (e) {}
  } else if (CLOUD.user && Store.db) await Store.connectWith(Store.db, CLOUD.user.id);
}
window.addEventListener("online", () => setTimeout(cloudResync, 1500));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && CLOUD.offline) cloudResync(); });
if (CLOUD.sb) {
  CLOUD.sb.auth.onAuthStateChange((ev, session) => {
    setTimeout(() => {
      if (ev === "PASSWORD_RECOVERY") { authModal("nova"); return; }
      cloudSession(session);
    }, 0);
  });
}

const AUTH_ERR = [
  [/invalid login credentials/i, "E-mail ou senha incorretos."],
  [/email not confirmed/i, "Falta confirmar o e-mail. Abra o link que enviamos e tente de novo."],
  [/already registered|already exists/i, "Esse e-mail já tem conta. Use Entrar."],
  [/rate limit|too many|security purposes/i, "Muitas tentativas seguidas. Espere alguns minutos e tente de novo."],
  [/password should be at least|weak/i, "A senha precisa ter pelo menos 6 caracteres."],
  [/invalid.*email|unable to validate email/i, "Esse e-mail não parece válido."],
  [/fetch|network/i, "Sem conexão com a internet agora."]
];
const authMsg = e => { const m = (e && (e.message || e.msg)) || ""; const hit = AUTH_ERR.find(([r]) => r.test(m)); return hit ? hit[1] : "Não deu certo agora. Tente de novo em instantes."; };

function accountBlock(){
  if (!CLOUD.sb) return `<div class="note">${ic("info")}<span>Seus dados ficam salvos <b>neste aparelho</b>. Faça um backup de vez em quando.</span></div>`;
  if (CLOUD.user) return `<div class="mgroup"><div class="mgroup-h">Sua conta<span class="pill good">na nuvem</span></div>
    <p class="sub" style="margin:0">Conectado como <b>${esc(CLOUD.user.email || "")}</b>. Seus dados ficam salvos na sua conta e aparecem em qualquer aparelho em que você entrar.</p>
    <div class="row" style="gap:8px"><button class="btn sm ghost danger" data-act="logout">Sair da conta</button></div></div>`;
  return `<div class="mgroup"><div class="mgroup-h">Salve na nuvem<span class="pill">grátis</span></div>
    <p class="sub" style="margin:0">Crie uma conta com seu e-mail para guardar dieta, treinos, medidas e fotos com segurança e usar no celular e no computador. Sem conta, tudo fica só neste aparelho.</p>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-act="authOpen" data-arg="criar">${ic("user")}Criar conta</button><button class="btn sm" data-act="authOpen" data-arg="entrar">Já tenho conta</button></div></div>`;
}

let AUTH = {mode:"criar", msg:"", ok:"", email:"", where:"gate"};
function authForm(){
  const m = AUTH.mode, gate = AUTH.where === "gate";
  return `<form class="col" data-auth style="gap:12px" novalidate>
      ${m === "entrar" || m === "criar" ? `<div class="${gate ? "seg" : "chips"}" role="group" aria-label="Entrar ou criar conta"><button type="button" class="${gate ? "" : "chip"}" data-act="authOpen" data-arg="criar" aria-pressed="${m === "criar"}">Criar conta</button><button type="button" class="${gate ? "" : "chip"}" data-act="authOpen" data-arg="entrar" aria-pressed="${m === "entrar"}">Entrar</button></div>` : ""}
      ${m === "criar" ? `<div class="field"><label for="au-name">Como quer ser chamado</label><input id="au-name" class="input" autocomplete="given-name" maxlength="40" placeholder="Ex.: Fernando"></div>` : ""}
      ${m !== "nova" ? `<div class="field"><label for="au-email">E-mail</label><input id="au-email" class="input" type="email" autocomplete="email" inputmode="email" required value="${esc(AUTH.email)}" placeholder="voce@email.com"></div>` : ""}
      ${m !== "senha" ? `<div class="field"><label for="au-pass">${m === "nova" ? "Nova senha" : "Senha"}</label><input id="au-pass" class="input" type="password" minlength="6" required autocomplete="${m === "entrar" ? "current-password" : "new-password"}" placeholder="Mínimo de 6 caracteres"></div>` : ""}
      ${AUTH.msg ? `<div class="note warn">${ic("alert")}<span>${esc(AUTH.msg)}</span></div>` : ""}
      ${AUTH.ok ? `<div class="note good">${ic("check")}<span>${AUTH.ok}</span></div>` : ""}
      <button class="btn primary" type="submit" ${CLOUD.busy ? "disabled" : ""}>${CLOUD.busy ? "Aguarde…" : {entrar:"Entrar", criar:"Criar minha conta grátis", senha:"Enviar link de recuperação", nova:"Salvar nova senha"}[m]}</button>
      ${m === "entrar" ? `<button type="button" class="btn ghost sm" data-act="authOpen" data-arg="senha">Esqueci minha senha</button>` : ""}
      ${m === "senha" ? `<button type="button" class="btn ghost sm" data-act="authOpen" data-arg="entrar">Voltar para Entrar</button>` : ""}
    </form>`;
}
function renderGate(){
  const g = document.getElementById("gate"); if (!g || g.hidden) return;
  const title = {entrar:"Bem-vindo de volta", criar:"Crie sua conta", senha:"Recuperar senha", nova:"Nova senha"}[AUTH.mode];
  const sub = {entrar:"Entre para ver sua dieta, treinos e evolução.", criar:"Grátis. Seus dados ficam salvos na nuvem e aparecem em qualquer aparelho.", senha:"Digite seu e-mail e enviamos um link para criar uma nova senha.", nova:"Escolha a nova senha da sua conta."}[AUTH.mode];
  g.innerHTML = `<div class="gate-in">
    <div class="gate-hero"><img class="gate-logo" src="${LOGO_SRC}" alt="Desfrangolizador">
      <h1>Saia do <span>modo frango.</span></h1>
      <p>Dieta flexível, treino de hipertrofia e evolução do corpo em um só app.</p>
      <ul class="gate-list">${[["flame","Calorias, macros e água calculados para você"],["plate","Mais de 250 alimentos e troca grama a grama"],["dumbbell","Fichas de treino com carga, RPE e descanso"],["ruler","Medidas, % de gordura e fotos de antes e depois"],["medal","Níveis de Frango a Avançado"]].map(([i, t]) => `<li>${ic(i)}<span>${t}</span></li>`).join("")}</ul>
    </div>
    <div class="gate-card"><h2>${title}</h2><div class="sub">${sub}</div>${authForm()}
      <div class="gate-foot"><a href="sobre.html" style="color:var(--accent);font-weight:700;text-decoration:none">Conheça o app e veja como instalar →</a><br>Cada pessoa vê apenas os próprios dados. Valores nutricionais são aproximados e não substituem acompanhamento profissional.</div></div>
  </div>`;
  const f = g.querySelector(AUTH.mode === "criar" ? "#au-name" : "#au-email") || g.querySelector("#au-pass");
  if (f && matchMedia("(min-width:821px)").matches) f.focus();
}
function showGate(){ const g = document.getElementById("gate"); if (!g) return; const was = g.hidden; g.hidden = false; AUTH.where = "gate"; if (was) { AUTH.msg = ""; AUTH.ok = ""; } document.body.style.overflow = "hidden"; renderGate(); }
function hideGate(){ const g = document.getElementById("gate"); if (!g || g.hidden) return; g.hidden = true; g.innerHTML = ""; document.body.style.overflow = ""; AUTH.where = "modal"; }
function authModal(mode){
  if (mode) AUTH.mode = mode;
  const g = document.getElementById("gate");
  if (g && !g.hidden && AUTH.mode !== "nova") { renderGate(); return; }
  AUTH.where = "modal";
  const title = {entrar:"Entrar", criar:"Criar conta", senha:"Recuperar senha", nova:"Nova senha"}[AUTH.mode];
  openModal(`${sheetHead(title, "Sua conta Desfrangolizador")}${authForm()}`);
}
document.addEventListener("submit", async ev => {
  const f = ev.target; if (!f.matches("[data-auth]")) return;
  ev.preventDefault(); if (CLOUD.busy) return;
  const email = (($("#au-email") || {}).value || "").trim(), pass = ($("#au-pass") || {}).value || "", name = (($("#au-name") || {}).value || "").trim();
  AUTH.email = email; AUTH.msg = ""; AUTH.ok = "";
  const m = AUTH.mode;
  if (m !== "nova" && !/^\S+@\S+\.\S+$/.test(email)) { AUTH.msg = "Digite um e-mail válido."; authModal(); return; }
  if (m !== "senha" && pass.length < 6) { AUTH.msg = "A senha precisa ter pelo menos 6 caracteres."; authModal(); return; }
  CLOUD.busy = true; authModal();
  const back = location.origin + location.pathname;
  try {
    if (m === "entrar") { const r = await CLOUD.sb.auth.signInWithPassword({email, password:pass}); if (r.error) throw r.error; CLOUD.busy = false; closeModal(); await cloudSession(r.data.session); toast("Bem-vindo de volta!"); if (!Store.get("welcome")) { Store.put("welcome", {seen:true}); aboutModal(true); } }
    else if (m === "criar") {
      const r = await CLOUD.sb.auth.signUp({email, password:pass, options:{emailRedirectTo:back, data:name ? {name} : {}}}); if (r.error) throw r.error;
      if (name) setP({nick:name});
      CLOUD.busy = false;
      if (r.data.session) { closeModal(); await cloudSession(r.data.session); toast("Conta criada"); if (!Store.get("welcome")) { Store.put("welcome", {seen:true}); aboutModal(true); } }
      else { AUTH.mode = "entrar"; AUTH.ok = `Enviamos um link de confirmação para <b>${esc(email)}</b>. Abra o e-mail, toque no link e depois entre aqui com sua senha.`; authModal(); }
    }
    else if (m === "senha") { const r = await CLOUD.sb.auth.resetPasswordForEmail(email, {redirectTo:back}); if (r.error) throw r.error; CLOUD.busy = false; AUTH.ok = `Se existir uma conta com <b>${esc(email)}</b>, você vai receber um link para criar uma nova senha.`; authModal(); }
    else if (m === "nova") { const r = await CLOUD.sb.auth.updateUser({password:pass}); if (r.error) throw r.error; CLOUD.busy = false; closeModal(); toast("Senha alterada"); }
  } catch (e) { CLOUD.busy = false; AUTH.msg = authMsg(e); authModal(); }
});

async function logout(){
  confirmBox("Sair da conta?", "Seus dados continuam salvos na nuvem. Este aparelho fica limpo até você entrar de novo.", "Sair", async () => {
    for (let i = 0; i < 20 && (Object.values(Store.busy).some(Boolean) || Object.values(Store.t).some(Boolean)); i++) { Object.keys(Store.t).forEach(k => { if (Store.t[k]) { clearTimeout(Store.t[k]); Store.t[k] = null; Store.flush(k); } }); await new Promise(r => setTimeout(r, 150)); }
    try { await CLOUD.sb.auth.signOut(); } catch (e) {}
    try { Object.keys(localStorage).filter(k => /^sb-.*-auth-token$/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    lsSet(LAST_USER, null); lsSet(PEND_DEL, null); CLOUD.offline = false;
    CLOUD.user = null; Store.db = null; VIEWER.name = "";
    try { Object.keys(localStorage).filter(k => k.startsWith(LS)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    try { const all = await PhotoDB.all(); await Promise.all(Object.keys(all).map(k => PhotoDB.del(k))); } catch (e) {}
    Store.mem = {};
    closeModal(); UI.tab = "inicio"; render(); setSync("local"); AUTH.mode = "entrar"; showGate();
  });
}

if (CLOUD.gateEarly) showGate();
/* Entrou antes neste aparelho e a sessão não volta logo (sem internet)? Abre com os dados do aparelho. */
if (CLOUD.sb && hasToken()) { if (!navigator.onLine) goOffline(); setTimeout(() => { if (!CLOUD.user) goOffline(); }, 3500); }
Object.assign(ACT, {
  authOpen: el => { AUTH.msg = ""; AUTH.ok = ""; authModal(el.dataset.arg); },
  logout: () => logout()
});
</script>
